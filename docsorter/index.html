<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>서류 자동분류</title>
  <link rel="stylesheet" href="assets/app.css?v=19">
</head>
<body>
  <div class="wrap">
    <h1>서류 자동분류</h1>
    <p id="sub" class="sub">알집을 놓으면 분류가 끝난 뒤 다운로드 폴더에 자동으로 들어갑니다.</p>

    <div id="gate" class="card-gate hidden">
      <p>지금은 사용할 수 없습니다.</p>
    </div>

    <div id="drop" class="drop">
      <input id="filePick" class="drop-file" type="file" multiple accept=".zip,application/zip">
      <strong>알집을 여기에 놓으세요</strong>
      <span>아이센스(임미경).zip 처럼 사람 알집을 놓으면, 그 사람 폴더 안에 초본·등본으로 나눕니다.</span>
    </div>

    <div id="workRow" class="row">
      <label class="namebox">이름
        <input id="personName" type="text" placeholder="한규숙" autocomplete="off">
      </label>
      <label class="filebtn" for="filePick">알집 고르기</label>
      <button id="runBtn" disabled>다시 받기</button>
      <button id="clearBtn" class="ghost">비우기</button>
    </div>

    <div id="status" class="status">사람 알집을 놓으세요. 끝나면 다운로드 폴더에 자동으로 들어갑니다.</div>
    <div id="list" class="list"></div>
    <p class="note">맥스금융처럼 같은 이름이 두 개면 맥스금융, 맥스금융_2 로 갈라집니다. zip을 풀면 서류함 → 이름 → 초본·등본·원본 입니다.</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
  <script src="assets/classify.js?v=19"></script>
  <script src="assets/app.js?v=19"></script>
</body>
</html>
