<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>서류 자동분류</title>
  <link rel="stylesheet" href="assets/app.css?v=9">
</head>
<body>
  <div class="wrap">
    <h1>서류 자동분류</h1>
    <p id="sub" class="sub">사람마다 따로 정리됩니다. 한규숙.zip 을 넣으면 한규숙 폴더, 다음 사람을 넣으면 그 사람 폴더가 생깁니다.</p>

    <div id="gate" class="card-gate hidden">
      <p>지금은 사용할 수 없습니다.</p>
    </div>

    <div id="drop" class="drop">
      <input id="filePick" class="drop-file" type="file" multiple>
      <strong>알집을 여기에 놓으세요</strong>
      <span>zip을 통째로 놓으면 바로 읽습니다. 사진, PDF도 됩니다.</span>
    </div>

    <div id="workRow" class="row">
      <label class="namebox">이름
        <input id="personName" type="text" placeholder="한규숙" autocomplete="off">
      </label>
      <label class="filebtn" for="filePick">알집 고르기</label>
      <button id="runBtn" disabled>내 컴퓨터에 폴더로 저장</button>
      <button id="clearBtn" class="ghost">비우기</button>
    </div>

    <div id="status" class="status">사람 알집을 놓으세요. 한규숙 다음엔 다른 사람 알집을 또 넣으면 됩니다.</div>
    <div id="list" class="list"></div>
    <p class="note">알집 이름이 그 사람 이름이 됩니다. 저장하면 서류함 → 한규숙 → 초본·등본·원본 으로 들어갑니다. 다음 사람도 같은 방식으로 계속 넣으면 사람마다 폴더가 쌓입니다.</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
  <script src="assets/classify.js?v=9"></script>
  <script src="assets/app.js?v=9"></script>
</body>
</html>
