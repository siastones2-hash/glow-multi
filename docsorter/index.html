<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>서류 자동분류</title>
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <div class="wrap">
    <h1>서류 자동분류</h1>
    <p id="sub" class="sub">서류 사진을 넣으면 초본, 등본, 사업자등록증처럼 이름과 폴더로 나눠 드립니다.</p>

    <div id="gate" class="card-gate hidden">
      <p>지금은 사용할 수 없습니다.</p>
    </div>

    <div id="drop" class="drop">
      <strong>여기에 파일을 놓으세요</strong>
      <span>사진, PDF, zip을 한꺼번에 넣어도 됩니다. 이름이 없어도 됩니다.</span>
    </div>

    <div id="workRow" class="row">
      <label class="filebtn">파일 고르기
        <input id="filePick" type="file" multiple accept=".zip,.pdf,.jpg,.jpeg,.png,.webp,.bmp,.gif,.tif,.tiff,.xlsx,.hwp,.hwpx">
      </label>
      <button id="runBtn" disabled>서류함에 다시 넣기</button>
      <button id="clearBtn" class="ghost">비우기</button>
    </div>

    <div id="status" class="status">파일을 넣으면 자동으로 읽기 시작합니다.</div>
    <div id="list" class="list"></div>
    <p class="note">파일을 넣으면 먼저 「서류함」 폴더를 한 번 고릅니다. 그다음 초본·등본 폴더가 생기고 파일이 각각 저장됩니다.</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
  <script src="assets/classify.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
