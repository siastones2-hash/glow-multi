<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>서류 자동분류</title>
  <link rel="stylesheet" href="assets/app.css?v=5">
</head>
<body>
  <div class="wrap">
    <h1>서류 자동분류</h1>
    <p id="sub" class="sub">서류 사진을 넣으면 초본, 등본, 사업자등록증처럼 이름과 폴더로 나눠 드립니다.</p>

    <div id="gate" class="card-gate hidden">
      <p>지금은 사용할 수 없습니다.</p>
    </div>

    <div id="drop" class="drop">
      <input id="filePick" class="drop-file" type="file" multiple>
      <strong>알집을 여기에 놓으세요</strong>
      <span>zip을 통째로 놓으면 바로 읽습니다. 사진, PDF도 됩니다.</span>
    </div>

    <div id="workRow" class="row">
      <label class="filebtn" for="filePick">파일 고르기</label>
      <button id="runBtn" disabled>내 컴퓨터 폴더로 넣기</button>
      <button id="clearBtn" class="ghost">비우기</button>
    </div>

    <div id="status" class="status">알집 zip을 상자 위에 놓으면 바로 읽기 시작합니다.</div>
    <div id="list" class="list"></div>
    <p class="note">알집을 놓으면 바로 압축을 풉니다. 끝나면 초본·등본 폴더가 들어 있는 서류함.zip 이 받아집니다. 「내 컴퓨터 폴더로 넣기」를 누르면 폴더로도 저장됩니다.</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
  <script src="assets/classify.js?v=5"></script>
  <script src="assets/app.js?v=5"></script>
</body>
</html>
