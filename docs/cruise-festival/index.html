<!doctype html>
<html lang="ko">
<head>

<title>파일에 액세스할 수 없음</title>
<style>
  html,body{margin:0;height:100%;background:#fff;color:#202124;font:14px/1.5 "Segoe UI",Roboto,"Apple SD Gothic Neo",sans-serif}

  .icon{width:72px;height:72px;margin:0 0 20px;color:#9aa0a6}
  h1{margin:0 0 10px;font-size:24px;font-weight:400}

</style>
</head>
<body>
<main>
  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
    <path d="M7 3.5h6.5L19 9v11.5H7z"/>
    <path d="M13.5 3.5V9H19"/>
  </svg>
  <h1>파일에 액세스할 수 없음</h1>
  <p>이동, 수정 또는 삭제되었을 수 있습니다.</p>
  <div class="code">ERR_FILE_NOT_FOUND</div>

</html>
