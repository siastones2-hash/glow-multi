<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>용마미식거리</title>
  <meta name="description" content="강원 강릉시 경강로 포남1동주민센터 일대. 용마미식거리를 3D로 걸어볼 수 있습니다." />
  <meta property="og:title" content="용마미식거리" />
  <meta property="og:description" content="강원 강릉시 경강로 포남1동주민센터 일대" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #100c09; }
    body {
      color: #f4ecdf;
      font-family: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

    .app { height: 100%; display: flex; min-width: 0; }
    .rail {
      width: 280px;
      flex: none;
      display: flex;
      flex-direction: column;
      padding: 28px 22px 20px;
      background:
        linear-gradient(180deg, rgba(228,161,90,.16), transparent 180px),
        #17110d;
      border-right: 1px solid rgba(244,236,223,.08);
    }
    .kicker {
      margin: 0;
      color: #e4a15a;
      font-size: 12px;
      font-weight: 650;
      letter-spacing: .22em;
    }
    h1 {
      margin: 14px 0 0;
      font-size: 34px;
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -.04em;
    }
    .place {
      margin: 12px 0 0;
      color: rgba(244,236,223,.62);
      font-size: 13px;
      line-height: 1.55;
    }
    nav { display: flex; flex-direction: column; gap: 6px; margin-top: 28px; }
    nav button {
      min-height: 44px;
      padding: 0 14px;
      border-radius: 12px;
      text-align: left;
      font-size: 15px;
      letter-spacing: -.02em;
    }
    nav button:hover { background: rgba(244,236,223,.06); }
    nav button[aria-current="true"] {
      background: #f4ecdf;
      color: #17110d;
      font-weight: 650;
    }
    .foot {
      margin-top: auto;
      padding-top: 18px;
      color: rgba(244,236,223,.48);
      font-size: 12px;
      line-height: 1.55;
    }

    .view { position: relative; flex: 1; min-width: 0; background: #000; }
    .view iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
    .mask {
      position: absolute;
      z-index: 2;
      top: 0;
      left: 0;
      width: 230px;
      height: 64px;
      background: linear-gradient(90deg, #000 0 180px, rgba(0,0,0,0));
    }
    .panel {
      position: absolute;
      z-index: 3;
      top: 16px;
      right: 16px;
      width: min(360px, calc(100% - 32px));
      padding: 22px 20px 16px;
      border-radius: 18px;
      background: rgba(23,17,13,.94);
      border: 1px solid rgba(244,236,223,.14);
      display: none;
    }
    .panel.open { display: block; }
    .panel h2 { margin: 0 0 10px; font-size: 18px; letter-spacing: -.03em; }
    .panel p { margin: 0; color: rgba(244,236,223,.84); font-size: 14px; line-height: 1.6; }
    .map { margin-top: 14px; height: 180px; border-radius: 12px; overflow: hidden; }
    .map iframe { width: 100%; height: 100%; border: 0; }
    .close {
      margin-top: 14px;
      height: 36px;
      padding: 0 14px;
      border-radius: 999px;
      background: #f4ecdf;
      color: #17110d;
      font-size: 13px;
      font-weight: 650;
    }
    .menu-btn { display: none; }

    @media (max-width: 800px) {
      .app { display: block; }
      .menu-btn {
        display: inline-flex;
        align-items: center;
        position: fixed;
        z-index: 6;
        top: 12px;
        left: 12px;
        height: 40px;
        padding: 0 14px;
        border-radius: 999px;
        background: rgba(23,17,13,.92);
        border: 1px solid rgba(244,236,223,.16);
      }
      .rail {
        position: fixed;
        z-index: 7;
        inset: 0 auto 0 0;
        width: min(300px, 88vw);
        transform: translateX(-105%);
        transition: transform .2s ease;
      }
      .rail.open { transform: none; }
      .view { height: 100%; }
      .mask { width: 150px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <button class="menu-btn" id="menu-btn" type="button">메뉴</button>
    <aside class="rail" id="rail">
      <p class="kicker">3D어라운드</p>
      <h1>용마미식거리</h1>
      <p class="place">강원 강릉시 경강로<br />포남1동주민센터 일대</p>
      <nav>
        <button type="button" id="walk" aria-current="true">거리 걷기</button>
        <button type="button" id="where">위치</button>
      </nav>
      <p class="foot">화면을 누르면 그쪽으로 걸어 들어갑니다.</p>
    </aside>

    <div class="view">
      <iframe
        id="tour"
        title="용마미식거리 3D 둘러보기"
        allow="fullscreen; xr-spatial-tracking"
        allowfullscreen
        referrerpolicy="no-referrer-when-downgrade"
        sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-forms allow-presentation"
      ></iframe>
      <div class="mask" aria-hidden="true"></div>

      <section class="panel" id="panel-where">
        <h2>위치</h2>
        <p>강원 강릉시 경강로 포남1동주민센터 일대</p>
        <div class="map">
          <iframe title="용마미식거리 위치" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://maps.google.com/maps?q=%EA%B0%95%EC%9B%90%20%EA%B0%95%EB%A6%89%EC%8B%9C%20%EA%B2%BD%EA%B0%95%EB%A1%9C%20%ED%8F%AC%EB%82%A81%EB%8F%99%EC%A3%BC%EB%AF%BC%EC%84%BC%ED%84%B0&amp;z=16&amp;output=embed"></iframe>
        </div>
        <button class="close" id="close" type="button">닫기</button>
      </section>
    </div>
  </div>

  <script>
    const src = "https://my.matterport.com/show/?m=o81fY7Gp7rJ&play=1&qs=1&lang=ko&title=0&help=0&hr=0&mls=0&brand=0";
    const frame = document.getElementById("tour");
    const rail = document.getElementById("rail");
    const panel = document.getElementById("panel-where");
    const walk = document.getElementById("walk");
    frame.src = src;

    function showWalk() {
      panel.classList.remove("open");
      walk.setAttribute("aria-current", "true");
      rail.classList.remove("open");
    }

    walk.addEventListener("click", () => {
      frame.src = src;
      showWalk();
    });

    document.getElementById("where").addEventListener("click", () => {
      const open = panel.classList.contains("open");
      panel.classList.toggle("open", !open);
      walk.setAttribute("aria-current", open ? "true" : "false");
      rail.classList.remove("open");
    });

    document.getElementById("close").addEventListener("click", showWalk);
    document.getElementById("menu-btn").addEventListener("click", () => {
      rail.classList.toggle("open");
    });
  </script>
</body>
</html>
