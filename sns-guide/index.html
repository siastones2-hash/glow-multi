<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Next.js + Supabase SNS 프로젝트 지침</title>
<meta name="description" content="Threads 스타일 SNS 웹앱 — Next.js + Supabase 개발 지침 (커서 전달용)">
<meta property="og:title" content="SNS 프로젝트 지침 (커서 전달용)">
<meta property="og:description" content="Next.js + Supabase로 Threads형 SNS 만들기 — 복붙 가능한 완성 코드">
<meta property="og:type" content="article">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
:root{--bg:#0d0f14;--card:#151922;--text:#e8eaef;--muted:#8b93a7;--line:#252b38;--accent:#6ee7ff;--code-bg:#0a0c10}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Pretendard,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.65;-webkit-font-smoothing:antialiased}
.top{position:sticky;top:0;z-index:10;background:rgba(13,15,20,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{font-size:15px;font-weight:700;letter-spacing:-.02em}
.top .sub{font-size:12px;color:var(--muted);margin-top:2px}
.top .actions{display:flex;gap:8px;flex-shrink:0}
.btn{border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 14px;border-radius:8px;font-size:13px;cursor:pointer;text-decoration:none}
.btn:hover{border-color:#3d4659}
.btn.primary{background:#1a3a4a;border-color:#2a6a7a;color:var(--accent)}
.wrap{max-width:820px;margin:0 auto;padding:28px 20px 80px}
#content h1{font-size:1.75rem;margin:0 0 1rem;line-height:1.3}
#content h2{font-size:1.25rem;margin:2.2rem 0 .75rem;padding-bottom:.4rem;border-bottom:1px solid var(--line)}
#content h3{font-size:1.05rem;margin:1.5rem 0 .5rem}
#content p,#content li{margin:.6rem 0}
#content ul,#content ol{padding-left:1.4rem}
#content blockquote{margin:1rem 0;padding:12px 16px;border-left:3px solid var(--accent);background:rgba(110,231,255,.06);border-radius:0 8px 8px 0;color:var(--muted);font-size:.95rem}
#content hr{border:none;border-top:1px solid var(--line);margin:2rem 0}
#content code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.88em;background:rgba(255,255,255,.06);padding:.15em .4em;border-radius:4px}
#content pre{position:relative;margin:1rem 0;background:var(--code-bg);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
#content pre code{display:block;padding:16px 18px;background:none;font-size:13px;line-height:1.55;white-space:pre}
.copy{position:absolute;top:8px;right:8px;font-size:11px;padding:4px 10px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer}
.copy.ok{color:var(--accent)}
.loading{color:var(--muted);padding:40px 0;text-align:center}
.err{color:#f87171;padding:20px;background:rgba(248,113,113,.08);border-radius:8px}
@media(max-width:640px){.top{flex-direction:column;align-items:flex-start}.wrap{padding:20px 16px 60px}}
</style>
</head>
<body>
<header class="top">
  <div>
    <h1>SNS 프로젝트 지침</h1>
    <div class="sub">Next.js + Supabase · 커서 전달용</div>
  </div>
  <div class="actions">
    <a class="btn" href="guide.md" download>MD 다운로드</a>
    <button class="btn primary" type="button" id="copyLink">링크 복사</button>
  </div>
</header>
<main class="wrap">
  <div id="content" class="loading">불러오는 중…</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
marked.setOptions({ gfm:true, breaks:false });
fetch('guide.md').then(r=>{
  if(!r.ok) throw new Error('guide.md 로드 실패');
  return r.text();
}).then(md=>{
  document.getElementById('content').className='';
  document.getElementById('content').innerHTML=marked.parse(md);
  document.querySelectorAll('#content pre').forEach(pre=>{
    const btn=document.createElement('button');
    btn.className='copy'; btn.textContent='복사';
    btn.onclick=()=>{
      const code=pre.querySelector('code');
      navigator.clipboard.writeText(code?code.innerText:pre.innerText).then(()=>{
        btn.textContent='복사됨'; btn.classList.add('ok');
        setTimeout(()=>{ btn.textContent='복사'; btn.classList.remove('ok'); },1500);
      });
    };
    pre.style.position='relative'; pre.appendChild(btn);
  });
}).catch(e=>{
  document.getElementById('content').className='err';
  document.getElementById('content').textContent=e.message;
});
document.getElementById('copyLink').onclick=()=>{
  navigator.clipboard.writeText(location.href).then(()=>{
    const b=document.getElementById('copyLink');
    b.textContent='복사됨!';
    setTimeout(()=>{ b.textContent='링크 복사'; },1500);
  });
};
</script>
</body>
</html>
