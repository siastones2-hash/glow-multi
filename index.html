<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#070d1a">
<title>FRANCHAIN v5.9.5 — 소림사 마케팅 관제</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0f1a;--bg-card:#121a2b;--bg-elevated:#182236;
  --border:rgba(148,163,184,.14);--text:#f1f5f9;--muted:#94a3b8;--dim:#64748b;
  --accent:#e8a317;--accent-soft:rgba(232,163,23,.12);
  --ok:#34d399;--warn:#fbbf24;--bad:#f87171;
  --radius:12px;--shadow:0 4px 20px rgba(0,0,0,.35);
  --fs-xs:.75rem;--fs-sm:.875rem;--fs-base:1rem;--fs-md:1.0625rem;--fs-lg:1.125rem;
  --fs-title:1.2rem;--fs-rank:1.625rem;--fs-rank-lg:2rem;
  --text-muted:#b0bcc9;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;
  --page-max:520px;
  --bottom-nav:56px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px;-webkit-text-size-adjust:100%;height:100%}
body{font-family:"Pretendard",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:var(--fs-base);line-height:1.5;overscroll-behavior:none;-webkit-font-smoothing:antialiased;min-height:100%;padding-left:var(--safe-l);padding-right:var(--safe-r)}
#root{min-height:100dvh;min-height:-webkit-fill-available}
#root button{min-height:44px;font-weight:600;font-size:var(--fs-sm);touch-action:manipulation}
#root input,#root select,#root textarea{min-height:44px;background:var(--bg-card);color:var(--text);border:1px solid var(--border);font-size:16px}
input,select,button,textarea{font-family:inherit}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:#334155;border-radius:4px}
.mono{font-family:'Space Mono',ui-monospace,monospace}
.fc-shell{min-height:100dvh;min-height:-webkit-fill-available;padding-bottom:calc(var(--bottom-nav) + var(--safe-b))}
.fc-page{width:100%;max-width:var(--page-max);margin:0 auto;padding-left:max(12px,var(--safe-l));padding-right:max(12px,var(--safe-r))}
.fc-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.fc-label{font-size:var(--fs-xs);font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.fc-h1{font-size:var(--fs-title);font-weight:800;color:var(--text);letter-spacing:-.02em;line-height:1.3}
.fc-muted{color:var(--text-muted);font-size:var(--fs-sm);line-height:1.4}
.fc-body{font-size:var(--fs-base);line-height:1.5;color:var(--text)}
.fc-rank{font-family:'Space Mono',ui-monospace,monospace;font-size:var(--fs-rank);font-weight:800;line-height:1.1}
.fc-rank--lg{font-size:var(--fs-rank-lg)}
.fc-stat{font-family:'Space Mono',ui-monospace,monospace;font-size:var(--fs-lg);font-weight:800;line-height:1.1}
.fc-list-name{font-size:var(--fs-md);font-weight:700;color:var(--text);line-height:1.35}
.fc-pill{font-size:var(--fs-sm);color:var(--text-muted);background:var(--bg-elevated);padding:4px 8px;border-radius:6px;line-height:1.3;white-space:nowrap}
.fc-pill b{font-weight:800;color:var(--text)}
.fc-action{font-size:var(--fs-sm);line-height:1.45;font-weight:500;padding:6px 8px;margin-top:6px;border-radius:6px;background:rgba(255,255,255,.04)}
.fc-badge-core{font-size:var(--fs-xs);font-weight:700;color:var(--accent);border:1px solid rgba(232,163,23,.4);padding:2px 6px;border-radius:4px}
.fc-chip{font-size:var(--fs-sm);font-weight:700;padding:3px 7px;border-radius:99px}
.fc-chart svg{max-height:72px}
.fc-chart .mono{font-size:var(--fs-sm)!important;line-height:1.3}
.fc-header{position:sticky;top:0;z-index:30;padding-top:max(10px,var(--safe-t));padding-left:max(15px,var(--safe-l));padding-right:max(15px,var(--safe-r))}
.fc-bottom-bar{position:fixed;bottom:0;left:0;right:0;padding-bottom:var(--safe-b);padding-left:var(--safe-l);padding-right:var(--safe-r)}
.fc-bottom-bar button{min-height:48px;padding:10px 4px 8px!important}
.fc-sia-mark{bottom:calc(var(--bottom-nav) + 12px + var(--safe-b))!important;right:max(10px,var(--safe-r))!important}
.fc-scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.fc-scroll-x::-webkit-scrollbar{display:none}
.fc-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}
.fc-priority-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;align-items:stretch}
.fc-store-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:stretch}
.fc-store-row__rank{text-align:right;flex-shrink:0;display:flex;flex-direction:column;justify-content:center;min-width:72px}
.fc-detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap}
.fc-detail-kw{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.fc-ch-compact{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}
.fc-sheet{padding-bottom:calc(32px + var(--safe-b))!important}
.apulse{animation:pulse 2s ease-in-out infinite}
.sia-credit{opacity:.5;transition:opacity .3s}
.sia-credit:hover{opacity:.9}
@media (max-width:420px){
  :root{--fs-title:1.05rem;--fs-rank:1.35rem;--fs-rank-lg:1.6rem;--fs-md:1rem;--fs-lg:1.05rem}
  .fc-priority-grid{grid-template-columns:1fr}
  .fc-store-row{grid-template-columns:1fr;gap:8px}
  .fc-store-row__rank{flex-direction:row;justify-content:space-between;align-items:center;text-align:left;min-width:0;border-top:1px solid var(--border);padding-top:8px;margin-top:2px}
  .fc-store-row__rank .fc-muted{margin-left:auto;max-width:none!important}
  .fc-detail-head .fc-rank-hide-sm{display:none!important}
  .fc-detail-kw{flex-direction:column;align-items:stretch}
  .fc-ch-compact{grid-template-columns:repeat(3,1fr);gap:4px}
  .fc-ch-table thead{display:none}
  .fc-ch-table tbody tr{display:block;margin-bottom:8px;padding:10px;border:1px solid var(--border);border-radius:10px;background:var(--bg-elevated)}
  .fc-ch-table td{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border:none;gap:10px}
  .fc-ch-table td::before{content:attr(data-label);font-size:var(--fs-xs);font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;flex-shrink:0}
  .fc-admin-table{font-size:var(--fs-sm)!important}
  .fc-admin-table th,.fc-admin-table td{padding:6px 4px!important;font-size:var(--fs-sm)!important}
}
@media (max-width:360px){
  :root{--fs-rank:1.2rem;--fs-rank-lg:1.45rem}
  .fc-pill{font-size:var(--fs-xs);padding:3px 6px}
}
.fc-landing-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.fc-landing-features{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.fc-landing-nav{padding-top:max(12px,var(--safe-t));padding-left:max(20px,var(--safe-l));padding-right:max(20px,var(--safe-r))}
@media (max-width:520px){
  .fc-landing-stats{grid-template-columns:repeat(2,1fr)}
  .fc-landing-features{grid-template-columns:1fr}
  .fc-landing-nav .fc-nav-btns{gap:6px}
  .fc-landing-nav .fc-nav-btns button{padding:8px 10px!important;font-size:.8rem!important}
}
</style>
</head>
<body>
<div id="root"></div>
<script src="app.bundle.js?v=1786486036903"></script>

</body></html>
