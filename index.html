<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#070d1a">
<title>FRANCHAIN v5.9.2 — 소림사 마케팅 관제</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0f1a;--bg-card:#121a2b;--bg-elevated:#182236;
  --border:rgba(148,163,184,.14);--text:#f1f5f9;--muted:#94a3b8;--dim:#64748b;
  --accent:#e8a317;--accent-soft:rgba(232,163,23,.12);
  --ok:#34d399;--warn:#fbbf24;--bad:#f87171;
  --radius:12px;--shadow:0 4px 20px rgba(0,0,0,.35);
  --fs-xs:.7rem;--fs-sm:.8125rem;--fs-base:.9375rem;--fs-md:1rem;--fs-lg:1.0625rem;
  --fs-title:1.125rem;--fs-rank:1.5rem;--fs-rank-lg:1.75rem;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;
  --page-max:480px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:"Pretendard",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:var(--fs-base);line-height:1.5;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
#root button{min-height:40px;font-weight:600;font-size:var(--fs-sm)}
#root input,#root select,#root textarea{min-height:40px;background:var(--bg-card);color:var(--text);border:1px solid var(--border);font-size:var(--fs-base)}
input,select,button,textarea{font-family:inherit}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:#334155;border-radius:4px}
.mono{font-family:'Space Mono',ui-monospace,monospace}
.fc-page{width:100%;max-width:var(--page-max);margin:0 auto}
.fc-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.fc-label{font-size:var(--fs-xs);font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.fc-h1{font-size:var(--fs-title);font-weight:800;color:var(--text);letter-spacing:-.02em;line-height:1.3}
.fc-muted{color:var(--muted);font-size:var(--fs-sm)}
.fc-body{font-size:var(--fs-base);line-height:1.45}
.fc-rank{font-family:'Space Mono',ui-monospace,monospace;font-size:var(--fs-rank);font-weight:800;line-height:1.1}
.fc-rank--lg{font-size:var(--fs-rank-lg)}
.fc-stat{font-family:'Space Mono',ui-monospace,monospace;font-size:var(--fs-lg);font-weight:800;line-height:1.1}
.fc-list-name{font-size:var(--fs-base);font-weight:600;color:var(--text)}
.fc-chip{font-size:var(--fs-sm);font-weight:700;padding:2px 6px;border-radius:99px}
.apulse{animation:pulse 2s ease-in-out infinite}
.sia-credit{opacity:.5;transition:opacity .3s}
.sia-credit:hover{opacity:.9}
</style>
</head>
<body>
<div id="root"></div>
<script src="app.bundle.js?v=1780275568565"></script>

</body></html>
