<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="app-version" content="meatmall-v1.0">
<title>정육 — 회원 전용 직거래</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --ink:#1A1614; --ink2:#241D1A; --ink3:#332924;
  --paper:#F6F1E9; --cream:#EFE6D6; --card:#FBF8F2;
  --garnet:#8E2F3A; --garnet-d:#6E2230; --ember:#C2622E; --brass:#B98A3E;
  --txt:#211C19; --muted:#7A6F66; --line:#E3D9C9; --line-d:rgba(255,255,255,.12);
  --ok:#3F7D4E; --warn:#B5742A; --bad:#A23A3A;
  --serif:"Noto Serif KR",serif; --sans:"Pretendard",-apple-system,sans-serif;
  --r:14px; --maxw:1080px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--txt);
  line-height:1.5;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
img{display:block;max-width:100%}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px}
.hidden{display:none!important}
.serif{font-family:var(--serif)}

/* ── buttons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:13px 20px;border-radius:11px;font-weight:600;font-size:15px;
  transition:.15s;white-space:nowrap}
.btn-pri{background:var(--garnet);color:#fff}
.btn-pri:active{background:var(--garnet-d)}
.btn-dark{background:var(--ink);color:var(--cream)}
.btn-dark:active{background:#000}
.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--txt)}
.btn-ghost:active{background:var(--cream)}
.btn-sm{padding:8px 13px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45;pointer-events:none}
.btn-block{width:100%}

/* ── gate (login) ── */
#auth{min-height:100dvh;display:flex;align-items:center;justify-content:center;
  padding:24px;position:relative;overflow:hidden;
  background:
    radial-gradient(120% 80% at 50% -10%, #3a2c25 0%, transparent 55%),
    radial-gradient(80% 60% at 90% 110%, #2a1c1d 0%, transparent 50%),
    var(--ink)}
#auth::before{content:"";position:absolute;inset:0;opacity:.05;
  background-image:repeating-linear-gradient(115deg,#fff 0 1px,transparent 1px 7px)}
.gate{width:100%;max-width:400px;position:relative;z-index:2}
.seal{width:96px;height:96px;border-radius:50%;margin:0 auto 22px;
  border:2px solid var(--brass);display:flex;align-items:center;justify-content:center;
  flex-direction:column;color:var(--brass);position:relative;
  box-shadow:0 0 0 6px rgba(185,138,62,.08)}
.seal::after{content:"";position:absolute;inset:7px;border-radius:50%;
  border:1px dashed rgba(185,138,62,.5)}
.seal b{font-family:var(--serif);font-size:21px;line-height:1;font-weight:700}
.seal span{font-size:9px;letter-spacing:.32em;margin-top:5px;padding-left:.32em}
.gate h1{font-family:var(--serif);color:var(--cream);text-align:center;
  font-size:27px;font-weight:600;letter-spacing:.02em}
.gate .sub{text-align:center;color:#9c8d80;font-size:13px;margin-top:8px;
  letter-spacing:.18em;text-transform:uppercase}
.gate-card{background:rgba(251,248,242,.97);border-radius:18px;padding:26px 22px;
  margin-top:26px;box-shadow:0 24px 60px rgba(0,0,0,.4)}
.tabs{display:flex;gap:4px;background:var(--cream);padding:4px;border-radius:11px;margin-bottom:20px}
.tab{flex:1;padding:10px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted);transition:.15s}
.tab.on{background:var(--ink);color:var(--cream)}
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;
  background:#fff;transition:.15s;color:var(--txt)}
.field input:focus{outline:none;border-color:var(--garnet)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{font-size:12px;color:var(--muted);margin-top:14px;text-align:center;line-height:1.6}
.err{background:#fbeaea;color:var(--bad);font-size:13px;padding:11px 14px;border-radius:9px;
  margin-bottom:14px;display:none}
.err.show{display:block}

/* ── pending ── */
#pending{min-height:100dvh;display:flex;align-items:center;justify-content:center;
  padding:30px;background:var(--ink);text-align:center}
#pending .box{max-width:380px;color:var(--cream)}
#pending .ic{font-size:46px;margin-bottom:14px}
#pending h2{font-family:var(--serif);font-size:24px;margin-bottom:12px}
#pending p{color:#a89a8d;font-size:14px;line-height:1.7}

/* ── app shell ── */
#app{min-height:100dvh;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:40;background:var(--ink);color:var(--cream);
  padding-top:env(safe-area-inset-top)}
.hbar{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;
  justify-content:space-between;padding:13px 16px}
.logo{display:flex;align-items:center;gap:9px;cursor:pointer}
.logo .mk{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--brass);
  display:flex;align-items:center;justify-content:center;color:var(--brass);
  font-family:var(--serif);font-weight:700;font-size:14px}
.logo b{font-family:var(--serif);font-size:18px;font-weight:600;letter-spacing:.04em}
.logo small{display:block;font-size:8px;letter-spacing:.3em;color:#9c8d80;margin-top:1px}
.hnav{display:flex;align-items:center;gap:3px}
.hnav button{padding:8px 12px;border-radius:9px;font-size:13.5px;font-weight:500;
  color:#cbbdaf;transition:.15s;position:relative}
.hnav button.on{color:var(--cream);background:rgba(255,255,255,.09)}
.cart-dot{position:absolute;top:2px;right:4px;background:var(--garnet);color:#fff;
  font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;padding:0 4px}
main{flex:1;max-width:var(--maxw);margin:0 auto;width:100%;padding:18px 16px 90px}

/* ── cinematic hero ── */
.hero2{position:relative;margin:-18px -16px 22px;min-height:78vh;display:flex;align-items:flex-end;
  overflow:hidden}
.hero2-bg{position:absolute;inset:0;background-size:cover;background-position:center;
  transform:scale(1.05);animation:heroZoom 16s ease-out both}
@keyframes heroZoom{from{transform:scale(1.18)}to{transform:scale(1.05)}}
.hero2-grad{position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(20,16,14,.55) 0%,rgba(20,16,14,.15) 30%,rgba(20,16,14,.75) 72%,var(--ink) 100%)}
.hero2-inner{position:relative;z-index:2;padding:0 22px 40px;color:#fff;width:100%;max-width:var(--maxw);margin:0 auto;
  animation:heroUp .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes heroUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.hero2-mk{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--brass);color:var(--brass);
  display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;
  font-size:21px;margin-bottom:20px;background:rgba(26,22,20,.4);backdrop-filter:blur(3px)}
.hero2-eyebrow{font-size:11.5px;letter-spacing:.4em;color:var(--brass);text-transform:uppercase;font-weight:600}
.hero2-h{font-family:var(--serif);font-size:clamp(34px,9vw,58px);font-weight:700;line-height:1.08;
  margin:12px 0 14px;letter-spacing:-.01em;text-shadow:0 2px 24px rgba(0,0,0,.5)}
.hero2-sub{color:#d8ccbe;font-size:15px;line-height:1.7;max-width:30em;margin-bottom:24px}
.hero2-inner .btn-pri{padding:15px 28px;font-size:15px;box-shadow:0 10px 30px rgba(142,47,58,.4)}
.hero2-stats{display:flex;gap:22px;margin-top:30px;flex-wrap:wrap}
.hero2-stats>div{display:flex;flex-direction:column}
.hero2-stats b{font-family:var(--serif);font-size:22px;font-weight:600;color:#fff}
.hero2-stats span{font-size:11.5px;color:#b6a89a;margin-top:2px;letter-spacing:.02em}

/* ── category chips ── */
.shop-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:18px;-ms-overflow-style:none;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:9px 17px;border-radius:30px;border:1.5px solid var(--line);
  background:var(--card);font-size:13.5px;font-weight:600;color:var(--muted);transition:.15s;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--cream);border-color:var(--ink)}

/* ── shop footer ── */
.shop-foot{margin:38px -16px -90px;padding:34px 22px calc(40px + env(safe-area-inset-bottom));
  background:var(--ink);color:#a89a8d;text-align:center}
.foot-brand{font-family:var(--serif);font-size:16px;color:var(--cream);letter-spacing:.06em;margin-bottom:14px}
.foot-links button{font-size:12px;color:#8a7d70;letter-spacing:.04em;padding:6px 10px;
  border:1px solid rgba(255,255,255,.14);border-radius:8px}

/* ── product grid ── */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;display:flex;flex-direction:column;transition:.18s}
.pcard:active{transform:scale(.985)}
.pthumb{aspect-ratio:1;position:relative;background:#ddd;overflow:hidden;cursor:pointer}
.pthumb img{width:100%;height:100%;object-fit:cover}
.grade{position:absolute;top:9px;left:9px;background:rgba(26,22,20,.86);color:var(--cream);
  font-size:10.5px;font-weight:600;padding:4px 9px;border-radius:6px;letter-spacing:.04em;
  border:1px solid rgba(185,138,62,.5)}
.pbody{padding:12px 13px 14px;display:flex;flex-direction:column;flex:1}
.pbody .nm{font-family:var(--serif);font-size:16px;font-weight:600;cursor:pointer}
.pbody .st{font-size:12px;color:var(--muted);margin-top:2px}
.pmeta{display:flex;align-items:baseline;justify-content:space-between;margin-top:10px;margin-bottom:11px}
.price{font-size:19px;font-weight:700;letter-spacing:-.02em}
.price small{font-size:12px;color:var(--muted);font-weight:500;margin-left:3px}
.unit{font-size:11px;color:var(--muted)}
.padd{margin-top:auto;display:flex;gap:7px;align-items:center}
.qstep{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:9px;overflow:hidden}
.qstep button{width:30px;height:34px;font-size:17px;color:var(--garnet);font-weight:600}
.qstep span{min-width:26px;text-align:center;font-weight:600;font-size:14px}

/* ── cart ── */
.section-h{font-family:var(--serif);font-size:22px;font-weight:600;margin-bottom:16px;
  display:flex;align-items:center;gap:9px}
.section-h .ln{flex:1;height:1px;background:var(--line)}
.citem{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:11px;margin-bottom:10px;align-items:center}
.citem img{width:64px;height:64px;border-radius:9px;object-fit:cover;flex-shrink:0}
.citem .ci-mid{flex:1;min-width:0}
.citem .ci-nm{font-family:var(--serif);font-weight:600;font-size:15px}
.citem .ci-pr{font-size:13px;color:var(--muted);margin-top:2px}
.ci-x{color:var(--muted);font-size:20px;padding:4px 6px;align-self:flex-start}
.summary{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:6px}
.sline{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:8px}
.sline.total{color:var(--txt);font-size:18px;font-weight:700;border-top:1px solid var(--line);
  padding-top:12px;margin-top:4px}
.empty{text-align:center;padding:54px 20px;color:var(--muted)}
.empty .ic{font-size:42px;margin-bottom:12px;opacity:.5}

/* ── checkout ── */
.formcard{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:18px;margin-bottom:14px}
.formcard h3{font-family:var(--serif);font-size:16px;margin-bottom:14px}
.formcard .field input,.formcard .field textarea,.formcard .field select{
  width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
.formcard .field textarea{min-height:60px;resize:vertical}
.formcard .field input:focus,.formcard textarea:focus{outline:none;border-color:var(--garnet)}
#payment-method,#agreement{margin-top:4px}

/* ── orders ── */
.ocard{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:14px;margin-bottom:11px}
.ohead{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.ono{font-size:12px;color:var(--muted);font-family:var(--sans)}
.odate{font-size:11px;color:var(--muted)}
.badge{font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px}
.b-pending{background:#f3ece0;color:var(--warn)}
.b-paid{background:#e4f0e6;color:var(--ok)}
.b-preparing{background:#fdeede;color:var(--ember)}
.b-shipped{background:#e3ecf5;color:#3a6ea5}
.b-done{background:#e9e4dc;color:var(--muted)}
.b-canceled{background:#fbeaea;color:var(--bad)}
.oitems{font-size:13.5px;color:var(--txt)}
.oitems span{color:var(--muted)}
.ofoot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;
  padding-top:10px;border-top:1px solid var(--line)}
.ofoot b{font-size:16px;font-weight:700}

/* ── modal ── */
.modal-bg{position:fixed;inset:0;background:rgba(20,16,14,.6);z-index:80;
  display:flex;align-items:flex-end;justify-content:center;padding:0}
.modal{background:var(--paper);width:100%;max-width:480px;border-radius:20px 20px 0 0;
  max-height:92dvh;overflow-y:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.m-img{aspect-ratio:1;width:100%;object-fit:cover}
.m-body{padding:20px 20px calc(24px + env(safe-area-inset-bottom))}
.m-grade{display:inline-block;background:var(--ink);color:var(--cream);font-size:11px;
  font-weight:600;padding:4px 10px;border-radius:6px;margin-bottom:10px;letter-spacing:.04em}
.m-nm{font-family:var(--serif);font-size:24px;font-weight:600}
.m-desc{color:var(--muted);font-size:14px;line-height:1.7;margin:12px 0 18px}
.m-rows{border-top:1px solid var(--line);margin-bottom:18px}
.m-row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.m-row span{color:var(--muted)}
.m-buy{display:flex;gap:10px;align-items:center}

/* ── admin ── */
.adm-tabs{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;padding-bottom:2px}
.adm-tab{padding:9px 15px;border-radius:9px;background:var(--cream);font-weight:600;
  font-size:13.5px;color:var(--muted);white-space:nowrap;flex-shrink:0}
.adm-tab.on{background:var(--ink);color:var(--cream)}
.adm-row{background:var(--card);border:1px solid var(--line);border-radius:11px;
  padding:13px;margin-bottom:9px}
.adm-row .ar-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.adm-row .ar-nm{font-weight:600;font-size:14.5px}
.adm-row .ar-sub{font-size:12px;color:var(--muted);margin-top:2px}
.adm-inline{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;align-items:center}
.adm-inline input,.adm-inline select{padding:8px 10px;border:1.5px solid var(--line);
  border-radius:8px;background:#fff;font-size:13px}
.mini{font-size:11px;font-weight:600;padding:5px 11px;border-radius:7px}
.mini-ok{background:var(--ok);color:#fff}
.mini-line{border:1.5px solid var(--line);color:var(--txt)}
.mini-bad{background:var(--bad);color:#fff}

/* ── toast ── */
#toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;
  transform:translateX(-50%) translateY(80px);background:var(--ink);color:var(--cream);
  padding:13px 22px;border-radius:30px;font-size:14px;font-weight:500;z-index:120;
  opacity:0;transition:.3s;box-shadow:0 10px 30px rgba(0,0,0,.3);white-space:nowrap;max-width:90vw}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* ── loader ── */
.loader{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--muted)}
.demo-badge{position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:100;
  background:var(--ember);color:#fff;font-size:11px;font-weight:600;padding:6px 12px;border-radius:20px;
  box-shadow:0 4px 14px rgba(0,0,0,.28);max-width:80vw;opacity:.96;letter-spacing:.01em}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--garnet);
  border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── admin dashboard ── */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:6px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 16px}
.stat.warn{border-color:var(--ember);background:#fdf3e9}
.stat .s-num{font-family:var(--serif);font-size:24px;font-weight:700;line-height:1.1}
.stat .s-num small{font-size:13px;font-weight:500;color:var(--muted);margin-left:2px}
.stat .s-lbl{font-size:12px;color:var(--muted);margin-top:4px}
.alert{background:#fdeede;border:1px solid var(--ember);color:#8a4a18;font-size:13px;
  padding:11px 14px;border-radius:10px;margin-top:12px}
.soldout{position:absolute;inset:0;background:rgba(26,22,20,.55);color:#fff;
  display:flex;align-items:center;justify-content:center;font-family:var(--serif);
  font-size:20px;font-weight:600;letter-spacing:.1em}
/* product form */
.pf-img{display:flex;gap:12px;align-items:center;margin-bottom:16px;
  background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px}
.pf-img img{width:72px;height:72px;border-radius:9px;object-fit:cover;background:var(--cream);flex-shrink:0}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;
  color:var(--txt);margin-top:6px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--garnet)}
.modal .field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px}

@media(min-width:680px){
  .stat-grid{grid-template-columns:repeat(4,1fr)}
  .grid{grid-template-columns:repeat(3,1fr);gap:18px}
  .modal{border-radius:20px;margin:auto}
  .modal-bg{align-items:center;padding:24px}
  .hero h2{font-size:34px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- ════ ADMIN LOGIN (관리자만) ════ -->
<section id="auth">
  <div class="gate">
    <div class="seal"><b>精</b><span>ADMIN</span></div>
    <h1>관리자 로그인</h1>
    <p class="sub">Store Management</p>
    <div class="gate-card">
      <div class="err" id="auth-err"></div>
      <div id="form-login" class="hidden"></div>
      <div id="form-signup" class="hidden"></div>
      <div id="form-admin">
        <div class="field"><label>관리자 아이디</label><input id="ad-email" type="email" value="" readonly style="background:var(--cream);color:var(--muted)"></div>
        <div class="field"><label>관리자 비밀번호</label><input id="ad-pw" type="password" autocomplete="current-password" value="123456" placeholder="••••••••"></div>
        <button class="btn btn-dark btn-block" id="ad-btn" onclick="doAdminLogin()">관리자 입장</button>
        <p class="note">최초 입장 시 입력한 비밀번호가 <b>관리자 비밀번호로 설정</b>됩니다.</p>
        <div style="text-align:center;margin-top:6px">
          <button onclick="backToShop()" style="font-size:12px;color:var(--muted)">← 쇼핑몰로 돌아가기</button>
        </div>
      </div>

function makeMockSupabase(){
  const KEY='meatmall_demo_db_v1';
  let DB;
  try{DB=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(!DB||!DB.products){DB={products:JSON.parse(JSON.stringify(DEMO_SEED)),profiles:[],orders:[],order_items:[],files:{},seq:{products:100,order_items:1}};}

    single(){this._s='single';return this;}

        if(/order_items\(/.test(this.sel)){rows=rows.map(o=>({...o,order_items:DB.order_items.filter(i=>String(i.order_id)===String(o.id))}));}
        if(this.lim)rows=rows.slice(0,this.lim);
        if(this._s==='single')return rows.length?{data:rows[0],error:null}:{data:null,error:{message:'no rows'}};
        if(this._s==='maybe')return{data:rows[0]||null,error:null};
        return{data:rows,error:null};
      }
      if(this.op==='insert'){
        const arr=Array.isArray(this.payload)?this.payload:[this.payload];
        const made=arr.map(r=>{const row={...r};
          if(this.t==='products'&&row.id==null)row.id=++DB.seq.products;
          if(this.t==='order_items'&&row.id==null)row.id=++DB.seq.order_items;
          if(this.t==='orders'&&row.id==null)row.id=(crypto.randomUUID?crypto.randomUUID():'o_'+Date.now()+Math.random());
          if(row.created_at==null)row.created_at=new Date().toISOString();
          tbl.push(row);return row;});
        save();
        if(this._s==='single')return{data:made[0],error:null};
        return{data:made,error:null};
      }
      if(this.op==='update'){tbl.forEach(r=>{if(match(r,this.f))Object.assign(r,this.payload);});save();return{data:null,error:null};}
      if(this.op==='delete'){DB[this.t]=tbl.filter(r=>!match(r,this.f));save();return{data:null,error:null};}
      return{data:null,error:null};
    }
  }
  const uid=e=>'demo_'+btoa(unescape(encodeURIComponent(e))).replace(/[^a-zA-Z0-9]/g,'').slice(0,16);
  function ensureProfile(email){
    let p=DB.profiles.find(x=>x.email===email);
    if(!p){const adm=email===CONFIG.ADMIN_EMAIL;
      p={id:uid(email),email,name:adm?'관리자':email.split('@')[0],role:adm?'admin':'member',approved:true,created_at:new Date().toISOString()};
      DB.profiles.push(p);save();}
    return p;
  }
  let _session=null;
  const auth={
    getSession:async()=>({data:{session:_session}}),
    signInWithPassword:async({email})=>{const p=ensureProfile(email);_session={user:{id:p.id,email}};return{data:{session:_session},error:null};},
    signInAnonymously:async()=>{const p=ensureProfile('guest@demo');_session={user:{id:p.id,email:null}};return{data:{session:_session},error:null};},
    signUp:async({email})=>{ensureProfile(email);return{data:{},error:null};},
    signOut:async()=>{_session=null;},
  };
  const storage={from:()=>({
    upload:async(path,file)=>{const d=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(file);});DB.files[path]=d;save();return{data:{path},error:null};},
    getPublicUrl:(path)=>({data:{publicUrl:DB.files[path]||path}}),
  })};
  return{from:t=>new QB(t),auth,storage};
}

// 오픈몰: 누구나 바로 입장. 주문을 위해 게스트 세션 확보.
async function ensureGuest(){
  if(session) return;
  try{
    const r=await sb.auth.signInAnonymously();
    session=r.data?.session||null;
  }catch(e){ session=null; } // 익명 로그인 비활성시에도 둘러보기는 가능
}
async function enterShop(){
  const {data:{session:s}}=await sb.auth.getSession(); session=s;
  if(!session) await ensureGuest();
  profile=null;
  if(session){ const {data}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle(); profile=data; }
  show('app');
  $('#nav-admin').classList.toggle('hidden', !(profile&&profile.role==='admin'));
  await loadProducts();
  updateCartDot();
  go('shop');
}

function show(which){

}

/* ═══ AUTH ═══ */
function switchTab(t){
  const tl=$('#tab-login'),ts=$('#tab-signup');
  if(tl)tl.classList.toggle('on',t==='login');
  if(ts)ts.classList.toggle('on',t==='signup');
  $('#form-login').classList.toggle('hidden',t!=='login');
  $('#form-signup').classList.toggle('hidden',t!=='signup');
  $('#form-admin').classList.toggle('hidden',t!=='admin');
  if(t==='admin'){$('#ad-email').value=CONFIG.ADMIN_EMAIL;setTimeout(()=>$('#ad-pw').focus(),50);}

}
function authErr(m){const e=$('#auth-err');e.textContent=m;e.classList.toggle('show',!!m);}

async function doAdminLogin(){
  const pw=$('#ad-pw').value;
  if(!pw) return authErr('관리자 비밀번호를 입력하세요');
  if(pw.length<6) return authErr('비밀번호는 6자 이상이어야 합니다');
  const email=CONFIG.ADMIN_EMAIL;
  const btn=$('#ad-btn');btn.disabled=true;btn.textContent='입장 중…';
  let {data,error}=await sb.auth.signInWithPassword({email,password:pw});
  if(error && /Invalid login/i.test(error.message)){
    // 최초 1회 — 관리자 계정 자동 생성 (가입 트리거가 admin 으로 지정)
    const up=await sb.auth.signUp({email,password:pw,options:{data:{name:'관리자'}}});
    if(up.error){btn.disabled=false;btn.textContent='관리자 입장';return authErr(humanErr(up.error.message));}
    ({data,error}=await sb.auth.signInWithPassword({email,password:pw}));
  }
  btn.disabled=false;btn.textContent='관리자 입장';
  if(error) return authErr(humanErr(error.message));
  session=data.session; authErr(''); await afterLogin();
}

async function doSignup(){
  const name=$('#su-name').value.trim(), phone=$('#su-phone').value.trim(),
        company=$('#su-company').value.trim(), email=$('#su-email').value.trim(), pw=$('#su-pw').value;
  if(!name||!email||!pw) return authErr('이름·이메일·비밀번호를 입력하세요');
  if(pw.length<6) return authErr('비밀번호는 6자 이상이어야 합니다');
  const btn=$('#su-btn');btn.disabled=true;btn.textContent='처리 중…';
  const {error}=await sb.auth.signUp({email,password:pw,options:{data:{name,phone,company}}});
  btn.disabled=false;btn.textContent='가입 신청';
  if(error) return authErr(humanErr(error.message));
  toast('가입 신청 완료 — 승인 후 입장 가능합니다');
  switchTab('login'); $('#li-email').value=email;
}

async function doLogin(){
  const email=$('#li-email').value.trim(), pw=$('#li-pw').value;
  if(!email||!pw) return authErr('이메일과 비밀번호를 입력하세요');
  const btn=$('#li-btn');btn.disabled=true;btn.textContent='입장 중…';
  const {data,error}=await sb.auth.signInWithPassword({email,password:pw});
  btn.disabled=false;btn.textContent='입장하기';
  if(error) return authErr(humanErr(error.message));
  session=data.session; authErr(''); await afterLogin();
}

async function doLogout(){ await sb.auth.signOut(); session=null;profile=null; location.href=location.pathname; }

function humanErr(m){
  if(/Invalid login/i.test(m))return'이메일 또는 비밀번호가 올바르지 않습니다';
  if(/already registered/i.test(m))return'이미 가입된 이메일입니다';
  if(/Email not confirmed/i.test(m))return'이메일 인증이 필요합니다 (Supabase 설정 확인)';
  return m;
}

// 관리자 로그인 성공 후
async function afterLogin(){
  for(let i=0;i<3;i++){
    const {data}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
    if(data){profile=data;break;}
    await new Promise(r=>setTimeout(r,400));
  }
  const isAdmin = profile && profile.role==='admin';
  show('app');
  $('#nav-admin').classList.toggle('hidden', !isAdmin);
  await loadProducts();
  updateCartDot();
  go(isAdmin?'admin':'shop');
  if(!isAdmin) toast('관리자 계정이 아닙니다');
}

    if((cart[slug]||0)>=p.stock)return toast(`재고가 부족합니다 (최대 ${p.stock}개)`);

  cart[slug]=(cart[slug]||0)+1;saveCart();toast('장바구니에 담았습니다');renderShop();

function setQty(slug,q){

  if(!DEMO)mountToss(total);
}

async function mountToss(total){
  try{
    const toss=TossPayments(CONFIG.TOSS_CLIENT);
    widgets=toss.widgets({customerKey: TossPayments.ANONYMOUS});
    await widgets.setAmount({currency:'KRW', value: total});
    await Promise.all([
      widgets.renderPaymentMethods({selector:'#payment-method', variantKey:'DEFAULT'}),
      widgets.renderAgreement({selector:'#agreement', variantKey:'AGREEMENT'}),
    ]);
  }catch(e){
    $('#payment-method').innerHTML='<p style="color:var(--bad);font-size:13px">결제창 로드 실패 — 토스 클라이언트 키를 확인하세요.</p>';
  }
}

async function startPayment(){
  const name=$('#co-name').value.trim(), phone=$('#co-phone').value.trim(),
        zip=$('#co-zip').value.trim(), a1=$('#co-addr1').value.trim(),
        a2=$('#co-addr2').value.trim(), memo=$('#co-memo').value.trim();
  if(!name||!phone||!a1) return toast('받는 분 정보를 입력하세요');
  const total=cartTotal();
  const items=Object.entries(cart).map(([slug,q])=>{const p=products.find(x=>x.slug===slug);return{p,q}}).filter(x=>x.p);
  if(!items.length) return toast('장바구니가 비어 있습니다');
  const orderName = items.length>1 ? `${items[0].p.name} 외 ${items.length-1}건` : items[0].p.name;

  // ── 데모 모드: 토스 없이 즉시 주문(결제완료) 생성 ──
  if(DEMO){
    const orderNo='DEMO_'+Date.now();
    const {data:order}=await sb.from('orders').insert({
      order_no:orderNo, user_id:session.user.id, status:'paid', total,
      receiver:name, phone, zipcode:zip, addr1:a1, addr2:a2, memo, pay_method:'데모결제'
    }).select().single();
    await sb.from('order_items').insert(items.map(({p,q})=>({order_id:order.id,product_id:p.id,name:p.name,price:p.price,qty:q})));
    cart={};saveCart();
    return paymentResult(true, orderNo);
  }

  if(!widgets) return toast('결제창이 아직 준비되지 않았습니다');
  const orderNo='MEAT_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
  // 1) 주문 생성 (pending)
  const {data:order,error}=await sb.from('orders').insert({
    order_no:orderNo, user_id:session.user.id, status:'pending', total,
    receiver:name, phone, zipcode:zip, addr1:a1, addr2:a2, memo
  }).select().single();
  if(error){console.error(error);return toast('주문 생성 실패: '+error.message);}
  // 2) 주문품목
  const rows=items.map(({p,q})=>({order_id:order.id,product_id:p.id,name:p.name,price:p.price,qty:q}));
  await sb.from('order_items').insert(rows);

  // 3) 토스 결제요청 (성공시 ?payment=success 로 복귀)
  const base=location.origin+location.pathname;
  try{
    await widgets.requestPayment({
      orderId:orderNo, orderName,
      successUrl: base+'?payment=success',
      failUrl: base+'?payment=fail',
      customerName: name, customerMobilePhone: phone.replace(/[^0-9]/g,''),
    });
  }catch(e){ toast('결제가 취소되었습니다'); }
}

/* ═══ PAYMENT RETURN ═══ */
async function handlePaymentReturn(q){
  // 세션 복구
  const {data:{session:s}}=await sb.auth.getSession(); session=s;
  if(session){const {data}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();profile=data;}
  show('app');
  if(profile)$('#nav-admin').classList.toggle('hidden', profile.role!=='admin');
  updateCartDot();
  $('#main').innerHTML='<div class="loader"><div class="spin"></div></div>';

  if(q.get('payment')==='fail'){
    const msg=q.get('message')||'결제가 취소되었거나 실패했습니다';
    return paymentResult(false, msg);
  }
  const paymentKey=q.get('paymentKey'), orderId=q.get('orderId'), amount=q.get('amount');
  if(!paymentKey||!orderId||!amount) return paymentResult(false,'결제 정보가 올바르지 않습니다');
  try{
    const res=await fetch(CONFIG.CONFIRM_FN,{
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':CONFIG.SUPABASE_ANON,'Authorization':'Bearer '+CONFIG.SUPABASE_ANON},
      body:JSON.stringify({paymentKey,orderId,amount:Number(amount)})
    });
    const data=await res.json();
    if(!res.ok||data.error) return paymentResult(false, data.error||'결제 승인 실패');
    cart={};saveCart();
    if(products.length===0)await loadProducts();
    paymentResult(true, orderId);
  }catch(e){ paymentResult(false,'승인 서버 연결 실패 — Edge Function 배포를 확인하세요'); }
}
function paymentResult(ok, info){
  history.replaceState(null,'',location.pathname);
  $('#main').innerHTML = ok
   ?`<div class="empty"><div class="ic">✅</div>
       <div style="font-family:var(--serif);font-size:22px;color:var(--txt)">결제가 완료되었습니다</div>
       <p style="margin-top:8px">주문번호 ${esc(info)}<br>주문내역에서 진행상황을 확인하세요.</p>
       <div style="margin-top:20px;display:flex;gap:10px;justify-content:center">
         <button class="btn btn-dark btn-sm" onclick="go('orders')">주문내역</button>
         <button class="btn btn-ghost btn-sm" onclick="go('shop')">계속 쇼핑</button></div></div>`
   :`<div class="empty"><div class="ic">⚠️</div>
       <div style="font-family:var(--serif);font-size:22px;color:var(--txt)">결제를 완료하지 못했습니다</div>
       <p style="margin-top:8px">${esc(info)}</p>
       <button class="btn btn-pri btn-sm" style="margin-top:20px" onclick="go('cart')">장바구니로</button></div>`;
}

        <label>재고 수량</label><input id="pf-stock" type="number" value="${p.stock||0}"></div>
      <div class="m-buy" style="margin-top:20px">
        <button class="btn btn-pri btn-block" onclick="saveProduct(${id?`'${id}'`:'null'})">${isNew?'등록하기':'수정 저장'}</button>
      </div>
      ${isNew?'':`<button class="btn btn-ghost btn-block" style="margin-top:10px;color:var(--bad);border-color:var(--bad)" onclick="deleteProduct('${id}')">상품 삭제</button>`}
    </div></div>
   </div>`;
}
async function uploadProductImg(){
  const f=$('#pf-file').files[0];
  if(!f)return toast('파일을 먼저 선택하세요');
  const msg=$('#pf-imgmsg');msg.textContent='업로드 중…';
  const path='prod_'+Date.now()+'_'+f.name.replace(/[^a-zA-Z0-9._-]/g,'');
  const {error}=await sb.storage.from('product').upload(path,f,{upsert:true,contentType:f.type});
  if(error){msg.textContent='업로드 실패 — Storage 버킷(product)을 확인하세요';return;}
  const {data}=sb.storage.from('product').getPublicUrl(path);
  $('#pf-imgurl').value=data.publicUrl;
  const pv=$('#pf-preview');pv.src=data.publicUrl;pv.style.opacity=1;
  msg.textContent='업로드 완료 ✓';
}
async function saveProduct(id){
  const name=$('#pf-name').value.trim();
  if(!name)return toast('상품명을 입력하세요');
  const price=parseInt($('#pf-price').value)||0;
  if(price<=0)return toast('가격을 입력하세요');
  const manage=$('#pf-managestock').checked;
  const rec={
    name, subtitle:$('#pf-subtitle').value.trim(), description:$('#pf-desc').value.trim(),
    grade:$('#pf-grade').value.trim(), origin:$('#pf-origin').value.trim(),
    unit:$('#pf-unit').value.trim(), price,
    image_url:$('#pf-imgurl').value.trim()||null, sort:parseInt($('#pf-sort').value)||0,
    active:$('#pf-active').value==='true', manage_stock:manage,
    stock: manage?(parseInt($('#pf-stock').value)||0):0,
  };
  let error;
  if(id&&id!=='null'){({error}=await sb.from('products').update(rec).eq('id',id));}
  else{rec.slug='p_'+Date.now();({error}=await sb.from('products').insert(rec));}
  if(error)return toast('저장 실패: '+error.message);
  await loadProducts();closeModal();toast(id&&id!=='null'?'수정했습니다':'상품을 등록했습니다');admProducts();
}
async function deleteProduct(id){
  if(!confirm('이 상품을 삭제할까요? 되돌릴 수 없습니다.'))return;
  const {error}=await sb.from('products').delete().eq('id',id);
  if(error)return toast('삭제 실패: '+error.message);
  await loadProducts();closeModal();toast('삭제했습니다');admProducts();
}

/* ═══ START ═══ */
init();
</script>
</body>
</html>
