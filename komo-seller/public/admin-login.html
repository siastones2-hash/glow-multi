<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>관리자 로그인 · 올픽유통</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#ff5d93">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#fff3f7;color:#3a2430;font-family:'Noto Sans KR',Arial,sans-serif;display:grid;place-items:center;padding:24px}
.box{width:min(420px,100%);background:#fff;border:2px solid #ffd6e4;border-radius:22px;padding:28px 22px;box-shadow:0 12px 0 rgba(255,141,184,.14)}
.mark{width:52px;height:52px;border-radius:16px;background:linear-gradient(180deg,#ff8fb8,#ff5d93);color:#fff;display:grid;place-items:center;font-size:26px;margin:0 auto 12px}
h1{margin:0 0 6px;text-align:center;font-size:24px;color:#d9487d}
.muted{margin:0 0 18px;text-align:center;color:#8a6b78;font-size:13px;font-weight:700}
label{display:block;margin:12px 0 5px;font-size:12px;font-weight:800;color:#8a6b78}
input{width:100%;height:48px;border:2px solid #ffd0e2;border-radius:12px;padding:0 12px;font-size:16px}
.btn{width:100%;margin-top:16px;height:48px;border:0;border-radius:14px;background:linear-gradient(180deg,#ff8fb8,#ff5d93);color:#fff;font-weight:900;cursor:pointer}
.err{display:none;margin-top:10px;color:#be123c;font-size:13px;font-weight:800;text-align:center}
.links{display:flex;justify-content:space-between;margin-top:14px}
.links a{color:#d9487d;font-weight:800;font-size:13px;text-decoration:none}
</style>
</head>
<body>
<div class="box">
  <div class="mark">♥</div>
  <h1>올픽유통 관리자</h1>
  <p class="muted">아이디와 비밀번호로 들어옵니다.</p>
  <label>아이디</label>
  <input id="id" autocomplete="username">
  <label>비밀번호</label>
  <input id="pw" type="password" autocomplete="current-password">
  <button class="btn" id="go" type="button">로그인</button>
  <div class="err" id="err"></div>
  <div class="links">
    <a href="/">고객몰</a>
    <a href="/admin/find">아이디·비밀번호 찾기</a>
  </div>
</div>
<script>
const next=new URLSearchParams(location.search).get('next')||'/admin/home';
async function already(){
  const s=await (await fetch('/local-api/admin/status')).json();
  if(s.loggedIn) location.replace(next);
}
function show(m){err.style.display='block';err.textContent=m}
async function login(){
  err.style.display='none';
  const r=await fetch('/local-api/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:id.value.trim(),password:pw.value})});
  const d=await r.json();
  if(d.success){location.replace(next);return}
  show(d.error||'로그인에 실패했습니다.');
}
go.onclick=login;
pw.addEventListener('keydown',e=>{if(e.key==='Enter')login()});
id.addEventListener('keydown',e=>{if(e.key==='Enter')pw.focus()});
already();
</script>
</body>
</html>
