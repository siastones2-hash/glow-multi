<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>도매자 관리 · 올픽유통</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#ff5d93">
<style>
*{box-sizing:border-box}body{margin:0;background:#fff3f7;color:#3a2430;font-family:'Noto Sans KR',Arial,sans-serif}
.wrap{max-width:980px;margin:auto;padding:22px 16px 80px}
.nav{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.nav a,.nav button{margin:0;color:#d9487d;font-weight:800;text-decoration:none;font-size:13px;background:none;border:0;cursor:pointer;height:auto;padding:0}
h1{margin:0 0 6px;font-size:24px;color:#d9487d}
h2{margin:0 0 10px;font-size:16px}
.muted{color:#8a6b78;font-size:13px;line-height:1.55}
.search{width:100%;height:46px;border:2px solid #ffd0e2;border-radius:12px;padding:0 12px;font-size:16px;margin:10px 0}
.box,.card{background:#fff;border:2px solid #ffd6e4;border-radius:18px;padding:16px;margin-bottom:12px}
.card{box-shadow:0 8px 0 rgba(255,141,184,.08)}
.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:flex-start;margin-bottom:10px}
.badge{display:inline-block;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:900;background:#e8f8ee;color:#147a3c;box-shadow:0 0 10px rgba(47,158,98,.25)}
.badge.off{background:#eee;color:#888;box-shadow:none}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}
.cell{background:#fff8fb;border:1px solid #ffe4ef;border-radius:12px;padding:10px}
.cell.ok{background:#f3fff6;border-color:#b7ebc6}
.cell.wait{background:#fff8e8;border-color:#ffe0a3}
.cell label{display:block;margin:0;font-size:11px;font-weight:800;color:#8a6b78}
.cell b{display:block;margin-top:4px;font-size:15px;color:#3a2430}
label{display:block;margin:8px 0 4px;font-size:12px;font-weight:800;color:#8a6b78}
input,textarea{width:100%;border:2px solid #ffd0e2;border-radius:12px;padding:10px;font-size:15px}
input{height:42px}
textarea{min-height:64px}
.form{display:none} .form.on{display:block}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{height:40px;border:0;border-radius:12px;background:linear-gradient(180deg,#ff8fb8,#ff5d93);color:#fff;font-weight:900;cursor:pointer;padding:0 12px}
.btn.gray{background:#fff;color:#8a4a63;border:2px solid #ffd0e2}
.btn.blue{background:#3a7bd5}
.btn.danger{background:#fff;color:#c62828;border:2px solid #ffb4b4}
.empty{padding:28px 8px;text-align:center;color:#8a6b78;font-weight:800}
#who{font-weight:900;color:#d9487d}
@media(max-width:720px){.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="nav">
    <a href="/">고객몰</a>
    <a href="/admin/home">관리홈</a>
    <a href="/admin/dealers">도매</a>
    <a href="/admin/products">상품</a>
    <a href="/admin/orders">주문</a>
    <a href="/admin/members">회원</a>
    <a href="/admin/me">내 정보</a>
    <span class="muted">로그인: <span id="who"></span></span>
    <button type="button" id="out">로그아웃</button>
  </div>
  <h1>도매자 관리</h1>
  <p class="muted">거래처를 등록하면 그 전화번호로 고객몰에 로그인할 수 있습니다. 주문·매출은 그 번호로 들어온 건만 집계합니다.</p>
  <div class="tools">
    <button class="btn" id="openNew" type="button">+ 새 도매자</button>
  </div>
  <div class="box form" id="newBox">
    <h2>새 도매자</h2>
    <label>상호</label><input id="nb" placeholder="예: 리즈컴">
    <label>담당자 이름</label><input id="nn" placeholder="이름">
    <label>휴대폰</label><input id="np" inputmode="numeric" placeholder="01012345678">
    <label>비밀번호</label><input id="nw" type="password" placeholder="4자 이상">
    <label>메모</label><textarea id="nm" placeholder="거래 조건, 배송 메모"></textarea>
    <div class="tools">
      <button class="btn" id="saveNew" type="button">등록</button>
      <button class="btn gray" id="cancelNew" type="button">닫기</button>
    </div>
  </div>
  <input class="search" id="q" placeholder="상호, 이름, 전화번호 검색">
  <div id="list"><div class="empty">불러오는 중...</div></div>
</div>
<script>
const won=n=>Number(n||0).toLocaleString('ko-KR')+'원';
const phoneFmt=v=>{const d=String(v||'').replace(/\D/g,'').slice(0,11);if(d.length<=3)return d;if(d.length<=7)return d.slice(0,3)+'-'+d.slice(3);return d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7)};
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function gate(){
  const s=await (await fetch('/local-api/admin/status')).json();
  if(!s.loggedIn){location.replace('/admin?next=/admin/dealers');return false}
  who.textContent=s.id||'관리자';
  return true;
}
async function put(id,body){
  const r=await fetch('/local-api/admin/members/'+encodeURIComponent(id),{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json();
  if(!d.success){alert(d.error||'실패');return}
  load();
}
openNew.onclick=()=>newBox.classList.add('on');
cancelNew.onclick=()=>newBox.classList.remove('on');
saveNew.onclick=async()=>{
  const r=await fetch('/local-api/admin/dealers',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({
    business:nb.value,name:nn.value,phone:np.value,password:nw.value,note:nm.value
  })});
  const d=await r.json();
  if(!d.success){alert(d.error||'실패');return}
  nb.value=nn.value=np.value=nw.value=nm.value='';
  newBox.classList.remove('on');
  load();
};
async function load(){
  const r=await fetch('/local-api/admin/dealers?q='+encodeURIComponent(q.value.trim()));
  const d=await r.json();
  if(!d.success){list.innerHTML='<div class="empty">'+(d.error||'로그인이 필요합니다.')+'</div>';return}
  const rows=d.dealers||[];
  list.innerHTML=rows.map(m=>`
    <article class="card" data-id="${esc(m.id)}">
      <div class="top">
        <div>
          <b>${esc(m.business||m.name)}</b>
          <span class="badge ${m.active?'':'off'}">${m.active?'활성':'이용중지'}</span>
          <div class="muted">${esc(m.name)} · ${phoneFmt(m.phone)}${m.note?' · '+esc(m.note):''}</div>
        </div>
      </div>
      <div class="grid">
        <div class="cell ok"><label>주문 매출</label><b>${won(m.orderTotal||0)}</b></div>
        <div class="cell"><label>주문</label><b>${m.orderCount||0}건</b></div>
        <div class="cell wait"><label>입금 대기</label><b>${won(m.waitTotal||0)}</b></div>
      </div>
      <div class="form" id="edit-${esc(m.id)}">
        <label>상호</label><input data-f="business" value="${esc(m.business)}">
        <label>이름</label><input data-f="name" value="${esc(m.name)}">
        <label>휴대폰</label><input data-f="phone" value="${esc(m.phone)}">
        <label>새 비밀번호</label><input data-f="password" type="password" placeholder="바꿀 때만 입력">
        <label>메모</label><textarea data-f="note">${esc(m.note)}</textarea>
        <button class="btn" data-save="${esc(m.id)}" type="button">저장</button>
      </div>
      <div class="tools">
        <button class="btn gray" data-edit="${esc(m.id)}" type="button">수정</button>
        <a class="btn blue" style="display:inline-flex;align-items:center;text-decoration:none" href="/admin/orders">주문</a>
        <button class="btn gray" data-off="${esc(m.id)}" type="button">${m.active?'이용중지':'이용재개'}</button>
        <button class="btn danger" data-drop="${esc(m.id)}" type="button">도매 해제</button>
      </div>
    </article>`).join('')||'<div class="empty">등록된 도매자가 없습니다. + 새 도매자로 거래처를 넣으세요.</div>';
  list.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{
    document.getElementById('edit-'+b.dataset.edit).classList.toggle('on');
  });
  list.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{
    const box=document.getElementById('edit-'+b.dataset.save);
    const body={};
    box.querySelectorAll('[data-f]').forEach(i=>{ if(i.value || i.dataset.f==='note' || i.dataset.f==='business') body[i.dataset.f]=i.value; });
    if(!body.password) delete body.password;
    put(b.dataset.save, body);
  });
  list.querySelectorAll('[data-off]').forEach(b=>b.onclick=()=>{
    put(b.dataset.off,{active:b.textContent!=='이용중지'});
  });
  list.querySelectorAll('[data-drop]').forEach(b=>b.onclick=()=>{
    if(!confirm('도매자에서 빼면 일반 회원으로 남습니다. 주문은 그대로 둡니다.')) return;
    put(b.dataset.drop,{dealer:false});
  });
}
let t=0;
q.oninput=()=>{clearTimeout(t);t=setTimeout(load,250)};
out.onclick=async()=>{
  await fetch('/local-api/admin/logout',{method:'POST'});
  location.replace('/admin');
};
(async()=>{ if(await gate()) load(); })();
</script>
</body>
</html>
