<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>주문 관리 · 올픽유통</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#ff5d93">
<style>
*{box-sizing:border-box}body{margin:0;background:#fff3f7;color:#3a2430;font-family:'Noto Sans KR',Arial,sans-serif}
.wrap{max-width:860px;margin:auto;padding:22px 16px 70px}
h1{margin:0 0 8px;font-size:22px;color:#d9487d}
.nav{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:8px}
.nav a,.nav button{margin:0;color:#d9487d;font-weight:800;text-decoration:none;background:none;border:0;cursor:pointer;height:auto;padding:0;font-size:13px}
.muted{color:#8a6b78;font-size:13px;line-height:1.55}
.stat,.filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.stat span,.filters button{background:#fff;border:1px solid #ffd0e2;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800;color:#d9487d;cursor:pointer}
.filters button.on{background:#ff5d93;color:#fff;border-color:#ff5d93}
.order{background:#fff;border:2px solid #ffd6e4;border-radius:18px;padding:16px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap;margin-bottom:10px}
.badge{display:inline-block;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:900;background:#ffe4ef;color:#d9487d}
.badge.ok{background:#e8f8ee;color:#147a3c}
.badge.wait{background:#fff3d6;color:#9a6b00}
.grid{display:grid;grid-template-columns:92px 1fr;gap:6px 10px;margin:10px 0;font-size:14px}
.grid b{color:#8a6b78;font-size:12px;padding-top:2px}
.addr{background:#fff8fb;border:1px solid #ffd6e4;border-radius:14px;padding:12px;font-weight:800;line-height:1.55}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.btn{height:42px;border:0;border-radius:12px;background:linear-gradient(180deg,#ff8fb8,#ff5d93);color:#fff;font-weight:900;cursor:pointer;padding:0 14px}
.btn.gray{background:#fff;color:#8a4a63;border:2px solid #ffd0e2}
.btn.ok{background:#2f9e62}
.btn.danger{background:#fff;color:#c62828;border:2px solid #ffb4b4}
select,input,textarea{width:100%;height:42px;border:2px solid #ffd0e2;border-radius:12px;padding:0 10px;font-size:15px}
textarea{height:72px;padding:8px 10px;resize:vertical}
select.pick{width:auto;min-width:140px}
.edit{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed #ffd0e2}
.edit.on{display:block}
.edit .row{display:grid;grid-template-columns:92px 1fr;gap:6px 10px;align-items:center;margin:8px 0}
.edit .row b{color:#8a6b78;font-size:12px}
.qty{display:flex;align-items:center;gap:8px;margin:6px 0}
.qty input{width:88px}
.empty{padding:28px 8px;text-align:center;color:#8a6b78;font-weight:800}
.items{margin:8px 0 0;padding:0;list-style:none}
.items li{padding:4px 0;border-bottom:1px solid #ffe4ef;font-size:13px;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <div class="nav">
    <a href="/">고객몰</a>
    <a href="/admin/home">관리홈</a>
    <a href="/admin/dealers">도매</a>
    <a href="/admin/products">상품</a>
    <a href="/admin/members">회원</a>
    <a href="/admin/me">내 정보</a>
    <button type="button" id="out">로그아웃</button>
  </div>
  <h1>주문 관리</h1>
  <p class="muted">주문 내용·배송지를 수정하거나 지울 수 있습니다. 바꾼 내용은 손님 주문 조회에도 바로 반영됩니다.</p>
  <div class="stat" id="stat"></div>
  <div class="filters" id="filters"></div>
  <div id="list"><div class="empty">불러오는 중...</div></div>
</div>
<script>
const won=n=>Number(n||0).toLocaleString('ko-KR')+'원';
const statuses=['입금대기','입금확인','배송중','완료','취소'];
let orders=[];
let filter='all';
let editing='';
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function addrText(o){return [o.name,o.phone,'('+ (o.zonecode||'')+')',o.address1,o.address2].filter(Boolean).join(' ')}
function match(o){
  if(filter==='pay')return o.status==='입금대기';
  if(filter==='addr')return o.status!=='취소'&&!o.addressChecked;
  if(filter==='ship')return o.addressChecked&&(o.status==='입금확인'||o.status==='배송중');
  return true;
}
async function gate(){
  const s=await (await fetch('/local-api/admin/status')).json();
  if(!s.loggedIn){location.replace('/admin?next=/admin/orders');return false}
  return true;
}
async function setOrder(id,body){
  const r=await fetch('/local-api/orders/'+encodeURIComponent(id),{
    method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(body)
  });
  const d=await r.json();
  if(!d.success){alert(d.error||'실패');return false}
  await loadOrders();
  return true;
}
async function delOrder(id){
  const r=await fetch('/local-api/orders/'+encodeURIComponent(id),{method:'DELETE'});
  const d=await r.json();
  if(!d.success){alert(d.error||'실패');return}
  if(editing===id) editing='';
  await loadOrders();
}
function render(){
  const count=s=>orders.filter(o=>o.status===s).length;
  const needAddr=orders.filter(o=>o.status!=='취소'&&!o.addressChecked).length;
  stat.innerHTML=`<span>전체 ${orders.length}</span><span>입금대기 ${count('입금대기')}</span><span>배송지 미확인 ${needAddr}</span><span>배송중 ${count('배송중')}</span>`;
  filters.innerHTML=[
    ['all','전체'],
    ['pay','입금 대기'],
    ['addr','배송지 미확인'],
    ['ship','발송 대상']
  ].map(([k,l])=>`<button type="button" class="${filter===k?'on':''}" data-f="${k}">${l}</button>`).join('');
  filters.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filter=b.dataset.f;render()});
  const shown=orders.filter(match);
  list.innerHTML=shown.map(o=>{
    const checked=!!o.addressChecked;
    const on=editing===o.id;
    return `<article class="order">
      <div class="top">
        <div>
          <b>${esc(o.id)}</b>
          <span class="badge ${o.status==='입금대기'?'wait':o.status==='취소'?'':'ok'}">${esc(o.status)}</span>
          <span class="badge ${checked?'ok':'wait'}">${checked?'배송지 확인됨':'배송지 미확인'}</span>
          <div class="muted">${o.createdAt?new Date(o.createdAt).toLocaleString('ko-KR'):''}</div>
        </div>
        <b>${won(o.total)}</b>
      </div>
      <div class="grid">
        <b>받는분</b><div>${esc(o.name)}</div>
        <b>전화</b><div><a href="tel:${esc(o.phone)}">${esc(o.phone)}</a></div>
        <b>배송지</b><div class="addr">(${esc(o.zonecode)}) ${esc(o.address1)}<br>${esc(o.address2||'')}</div>
        <b>요청</b><div>${esc(o.memo)||'-'}</div>
      </div>
      <ul class="items">${(o.items||[]).map(i=>`<li>${esc(i.name)} × ${esc(i.qty)} · ${won(i.price)}</li>`).join('')}</ul>
      <div class="tools">
        <select class="pick" data-status="${esc(o.id)}">${statuses.map(s=>`<option value="${s}" ${o.status===s?'selected':''}>${s}</option>`).join('')}</select>
        <button class="btn ${checked?'gray':'ok'}" data-addr="${esc(o.id)}" type="button">${checked?'배송지 확인 취소':'배송지 확인'}</button>
        <button class="btn gray" data-copy="${esc(o.id)}" type="button">주소 복사</button>
        <button class="btn gray" data-edit="${esc(o.id)}" type="button">${on?'수정 닫기':'수정'}</button>
        <button class="btn danger" data-del="${esc(o.id)}" type="button">삭제</button>
      </div>
      <div class="edit ${on?'on':''}">
        <div class="row"><b>받는분</b><input data-f="name" value="${esc(o.name)}"></div>
        <div class="row"><b>전화</b><input data-f="phone" value="${esc(o.phone)}"></div>
        <div class="row"><b>우편번호</b><input data-f="zonecode" value="${esc(o.zonecode)}"></div>
        <div class="row"><b>주소</b><input data-f="address1" value="${esc(o.address1)}"></div>
        <div class="row"><b>상세</b><input data-f="address2" value="${esc(o.address2||'')}"></div>
        <div class="row"><b>요청</b><textarea data-f="memo">${esc(o.memo||'')}</textarea></div>
        ${(o.items||[]).map((i,idx)=>`<div class="qty"><span>${esc(i.name)}</span><input data-qty="${idx}" type="number" min="0" value="${esc(i.qty)}"><span>${won(i.price)}</span></div>`).join('')}
        <div class="tools">
          <button class="btn" data-save="${esc(o.id)}" type="button">수정 저장</button>
        </div>
      </div>
    </article>`}).join('')||`<div class="empty">${orders.length?'이 조건의 주문이 없습니다.':'아직 주문이 없습니다. 손님이 주문하면 이름·전화·배송지가 여기 표시됩니다.'}</div>`;
  list.querySelectorAll('[data-status]').forEach(sel=>sel.onchange=()=>setOrder(sel.dataset.status,{status:sel.value}));
  list.querySelectorAll('[data-addr]').forEach(b=>b.onclick=()=>{
    const o=orders.find(x=>x.id===b.dataset.addr);
    setOrder(b.dataset.addr,{addressChecked:!o.addressChecked});
  });
  list.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{
    const o=orders.find(x=>x.id===b.dataset.copy);
    await navigator.clipboard.writeText(addrText(o));
    alert('배송지를 복사했습니다.');
  });
  list.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{
    editing=editing===b.dataset.edit?'':b.dataset.edit;
    render();
  });
  list.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    if(!confirm('이 주문을 삭제할까요? 손님 주문 조회에서도 사라집니다.')) return;
    delOrder(b.dataset.del);
  });
  list.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{
    const box=b.closest('.order');
    const o=orders.find(x=>x.id===b.dataset.save);
    const val=name=>box.querySelector('[data-f="'+name+'"]').value;
    const items=(o.items||[]).map((i,idx)=>{
      const qty=Math.max(0, Number(box.querySelector('[data-qty="'+idx+'"]').value||0));
      return {...i, qty};
    }).filter(i=>i.qty>0);
    if(!items.length){alert('상품 수량을 모두 0으로 두면 주문을 삭제해 주세요.');return}
    const ok=await setOrder(b.dataset.save,{
      name:val('name'),
      phone:val('phone'),
      zonecode:val('zonecode'),
      address1:val('address1'),
      address2:val('address2'),
      memo:val('memo'),
      items
    });
    if(ok) editing='';
  });
}
async function loadOrders(){
  const r=await fetch('/local-api/orders');
  const d=await r.json();
  if(!d.success){list.innerHTML='<div class="empty">'+(d.error||'로그인이 필요합니다.')+'</div>';return}
  orders=d.orders||[];
  render();
}
out.onclick=async()=>{
  await fetch('/local-api/admin/logout',{method:'POST'});
  location.replace('/admin');
};
(async()=>{ if(await gate()) loadOrders(); })();
</script>
</body>
</html>
