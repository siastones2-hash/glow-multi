<script>
const won=n=>Number(n||0).toLocaleString('ko-KR')+'원';
const phoneFmt=v=>{const d=String(v||'').replace(/\D/g,'').slice(0,11);if(d.length<=3)return d;if(d.length<=7)return d.slice(0,3)+'-'+d.slice(3);return d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7)};
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cartKey='komoShopCartV1';
const meKey='komoShopMeV1';
let member=null;
function getCart(){try{const v=JSON.parse(localStorage.getItem(cartKey)||'[]');return Array.isArray(v)?v:[]}catch(_){return[]}}
function setCart(c){localStorage.setItem(cartKey,JSON.stringify(c));syncCount()}
function syncCount(){const n=getCart().reduce((s,x)=>s+Number(x.qty||0),0);document.querySelectorAll('#cartN,#cartN2').forEach(el=>el.textContent=n)}
function getMe(){try{return JSON.parse(localStorage.getItem(meKey)||'{}')}catch(_){return{}}}
function setMe(m){localStorage.setItem(meKey,JSON.stringify(m))}
function hash(){return location.hash.replace(/^#/,'')||'/'}
function page(){
  const p=location.pathname.replace(/\/$/,'')||'/';
  if(p==='/login'||p==='/signup'||p==='/find'||p==='/me')return p;
  return hash();
}
function syncAuthNav(){
  navLogin.classList.toggle('hide',!!member);
  navMe.classList.toggle('hide',!member);
}
function nav(){
  const h=page();
  navHome.classList.toggle('on',h==='/'||h.startsWith('/p/'));
  navCart.classList.toggle('on',h.startsWith('/cart')||h.startsWith('/done'));
  navOrders.classList.toggle('on',h.startsWith('/orders'));
  navLogin.classList.toggle('on',h==='/login'||h==='/signup'||h==='/find');
  navMe.classList.toggle('on',h==='/me');
  document.getElementById('bar').style.display=(h==='/'||h.startsWith('/p/'))?'block':'none';
}
async function loadMember(){
  try{
    const d=await (await fetch('/local-api/member/me',{cache:'no-store'})).json();
    member=d.loggedIn?d.member:null;
  }catch(_){member=null}
  syncAuthNav();
}

let products=[];
async function loadCatalog(){
  const r=await fetch('/local-api/catalog',{cache:'no-store'});
  const d=await r.json();
  products=Array.isArray(d.products)?d.products:[];
}

function photo(p){return p.thumbnail||p.thumbnail_url||(p.media&&p.media.thumbnail)||''}
function bust(u){return u?u+(u.includes('?')?'&':'?')+'v=aioff':u}
function listThumb(p){return bust(photo(p).replace(/\/p(\d+)\.jpe?g$/i,'/t$1.jpg'))}
function fullImg(p){return bust(photo(p))}
function price(p){return Number(p.price||p.sale_price||0)}
function cartQty(id){
  const x=getCart().find(i=>i.productId===id);
  return x?Number(x.qty||0):0;
}
function unitOf(p){return Math.max(1,Number(p.order_unit||1))}
function changeItem(p,dir){
  if(!price(p)){alert('가격이 준비되지 않은 상품입니다.');return}
  const u=unitOf(p);
  const c=getCart();
  const id=p.product_id;
  let old=c.find(x=>x.productId===id);
  if(!old){
    if(dir<0)return;
    c.push({productId:id,name:p.name,thumbnail:listThumb(p),price:price(p),qty:u,orderUnit:u});
  }else{
    old.qty=Math.max(0,Number(old.qty||0)+dir*u);
    if(old.qty<=0)c.splice(c.indexOf(old),1);
  }
  setCart(c);
}
function cartControls(p){
  const n=cartQty(p.product_id);
  if(!n) return `<div data-cart="${p.product_id}"><button class="btn" data-add="${p.product_id}" type="button">담기</button></div>`;
  return `<div class="cartbox" data-cart="${p.product_id}"><button type="button" data-minus="${p.product_id}">−</button><b>${n}</b><button type="button" data-plus="${p.product_id}">+</button></div>`;
}
function refreshCartControl(id){
  const p=products.find(x=>x.product_id===id);
  if(!p)return;
  document.querySelectorAll('[data-cart="'+id+'"]').forEach(el=>{el.outerHTML=cartControls(p)});
  bindCartButtons(document);
}
function bindCartButtons(root){
  (root||document).querySelectorAll('[data-add],[data-plus],[data-minus]').forEach(b=>{
    b.onclick=e=>{
      e.preventDefault();
      e.stopPropagation();
      const id=b.dataset.add||b.dataset.plus||b.dataset.minus;
      const p=products.find(x=>x.product_id===id);
      if(!p)return;
      changeItem(p, b.dataset.minus!=null?-1:1);
      refreshCartControl(id);
    };
  });
}

function catClass(c){
  return ({산리오:'sanrio',짱구:'shin',리락쿠마:'rila',귀멸의칼날:'demon',포켓몬:'poke',체인소맨:'chainsaw',테디베어:'teddy',뽑기소모품:'claw',잡화:'misc'}[c]||'misc');
}
function sparkName(name){
  return esc(name||'').replace(/정품/g,'<span class="spark-word">정품</span>');
}
function productMarks(p){
  const pin=p.badge_genuine?'<span class="stamp">정품</span>':'';
  const chips=[
    p.badge_new?'<span class="chip sm new">신규</span>':'',
    p.badge_hot?'<span class="chip sm hot">핫한상품</span>':'',
    p.badge_low?'<span class="chip sm low">품절임박</span>':''
  ].filter(Boolean).join('');
  return {pin, chips};
}
function hasMark(p,mark){
  if(mark==='new') return !!p.badge_new;
  if(mark==='hot') return !!p.badge_hot;
  if(mark==='low') return !!p.badge_low;
  if(mark==='genuine') return !!p.badge_genuine;
  return false;
}
function sortShop(list){
  const sort=window._sort||'new';
  const created=p=>{
    const t=Date.parse(p.createdAt||'');
    return Number.isFinite(t)?t:0;
  };
  return list.slice().sort((a,b)=>{
    if(sort==='sold'){
      const d=Number(b.soldQty||0)-Number(a.soldQty||0);
      if(d) return d;
      const d2=Number(b.orderQty||0)-Number(a.orderQty||0);
      if(d2) return d2;
    }else if(sort==='hot'){
      const d=Number(b.orderCount||0)-Number(a.orderCount||0);
      if(d) return d;
      const d2=Number(b.orderQty||0)-Number(a.orderQty||0);
      if(d2) return d2;
    }else if(sort==='priceAsc'){
      const d=Number(a.price||0)-Number(b.price||0);
      if(d) return d;
    }else if(sort==='priceDesc'){
      const d=Number(b.price||0)-Number(a.price||0);
      if(d) return d;
    }else{
      const d=created(b)-created(a);
      if(d) return d;
    }
    return String(a.product_id).localeCompare(String(b.product_id),'ko');
  });
}

    const d=await r.json();
    if(!d.success){alert(d.error||'실패');return}
    alert('비밀번호를 바꿨습니다. 새 비밀번호로 로그인해주세요.');
    location.replace('/login');
  };
}

function renderMe(){
  if(!member){location.replace('/login');return}
  app.innerHTML=`
    <div class="box" style="max-width:520px;margin:0 auto">
      <h2 style="margin:0 0 8px">내 정보</h2>
      <p class="muted">이름·이메일·휴대폰을 저장해 두면 비밀번호를 잊어버렸을 때 찾을 수 있습니다.</p>
      <div class="field"><label>이름</label><input id="mn" value="${esc(member.name||'')}"></div>
      <div class="field"><label>휴대폰</label><input id="mp" value="${esc(phoneFmt(member.phone||''))}"></div>
      <div class="field"><label>이메일</label><input id="memail" type="email" value="${esc(member.email||'')}"></div>
      <div class="field"><label>우편번호</label><div style="display:flex;gap:8px"><input id="mz" value="${esc(member.zonecode||'')}" readonly><button class="btn" id="addrBtn" type="button" style="width:120px;margin:0">주소 검색</button></div></div>
      <div class="field"><label>주소</label><input id="ma1" value="${esc(member.address1||'')}" readonly></div>
      <div class="field"><label>상세주소</label><input id="ma2" value="${esc(member.address2||'')}"></div>
      <button class="btn" id="saveInfo" type="button">내 정보 저장</button>
    </div>
    <div class="box" style="max-width:520px;margin:0 auto">
      <h2 style="margin:0 0 8px">비밀번호 변경</h2>
      <div class="field"><label>현재 비밀번호</label><input id="cur" type="password"></div>
      <div class="field"><label>새 비밀번호</label><input id="pw1" type="password" placeholder="4자 이상"></div>
      <div class="field"><label>새 비밀번호 확인</label><input id="pw2" type="password"></div>
      <button class="btn" id="savePw" type="button">비밀번호 저장</button>
      <div class="links"><a href="#/" id="out">로그아웃</a></div>
    </div>
    <div class="box" style="max-width:520px;margin:0 auto">
      <h2 style="margin:0 0 8px">회원 탈퇴</h2>
      <p class="muted">탈퇴하면 로그인할 수 없습니다. 같은 휴대폰으로 다시 가입할 수 있고, 지난 주문은 관리자에 남습니다.</p>
      <button class="btn" id="leave" type="button" style="background:#fff;color:#c62828;border:2px solid #ffb4b4">회원 탈퇴</button>
    </div>`;
  mp.oninput=e=>e.target.value=phoneFmt(e.target.value);
  addrBtn.onclick=()=>{
    new daum.Postcode({oncomplete:d=>{
      mz.value=d.zonecode;
      ma1.value=d.roadAddress||d.address;
    }}).open();
  };
  saveInfo.onclick=async()=>{
    const r=await fetch('/local-api/member/me',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({name:mn.value,phone:mp.value,email:memail.value,zonecode:mz.value,address1:ma1.value,address2:ma2.value})});
    const d=await r.json();
    if(!d.success){alert(d.error||'실패');return}
    member=d.member;
    alert('저장했습니다.');
  };
  savePw.onclick=async()=>{
    if(pw1.value!==pw2.value){alert('새 비밀번호 확인이 같지 않습니다.');return}
    const r=await fetch('/local-api/member/me',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({current:cur.value,password:pw1.value})});
    const d=await r.json();
    if(!d.success){alert(d.error||'실패');return}
    cur.value='';pw1.value='';pw2.value='';
    alert('비밀번호를 바꿨습니다.');
  };
  out.onclick=async e=>{
    e.preventDefault();
    await fetch('/local-api/member/logout',{method:'POST'});
    member=null;syncAuthNav();
    location.replace('/');
  };
  leave.onclick=async()=>{
    if(!confirm('정말 탈퇴할까요? 같은 휴대폰으로 다시 가입할 수 있습니다.')) return;
    const r=await fetch('/local-api/member/me',{method:'DELETE'});
    const d=await r.json();
    if(!d.success){alert(d.error||'실패');return}
    member=null;syncAuthNav();
    alert('탈퇴했습니다.');
    location.replace('/');
  };
}

let routeN=0;
async function route(){
  const n=++routeN;
  await loadMember();
  if(n!==routeN)return;
  nav();syncCount();
  const h=page();
  if(h==='/'){if(!products.length)await loadCatalog();if(n!==routeN)return;renderHome()}
  else if(h.startsWith('/p/')){if(!products.length)await loadCatalog();if(n!==routeN)return;renderProduct(decodeURIComponent(h.slice(3)))}
  else if(h.startsWith('/done/'))renderDone(h.split('/')[2]);
  else if(h.startsWith('/orders'))renderOrders();
  else if(h==='/login')renderLogin();
  else if(h==='/signup')renderSignup();
  else if(h==='/find')renderFind();
  else if(h==='/me')renderMe();
  else renderCart();
}
document.getElementById('q').oninput=()=>{if(page()==='/')renderHome()};
document.getElementById('bar').onclick=()=>location.hash='#/cart';
window.addEventListener('hashchange',route);
(function(){
  const el=document.getElementById('intro');
  const skip=window.matchMedia('(prefers-reduced-motion: reduce)').matches||sessionStorage.getItem('ollpick_intro');
  if(!el||skip){if(el)el.remove();document.body.classList.remove('intro-lock');return}
  setTimeout(()=>el.classList.add('exit'),1300);
  setTimeout(()=>{
    el.classList.add('done');
    document.body.classList.remove('intro-lock');
    sessionStorage.setItem('ollpick_intro','1');
    el.remove();
  },2000);
})();
route();
</script>
</body>
</html>
