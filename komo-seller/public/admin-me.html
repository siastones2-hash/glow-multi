<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>내 정보 · 올픽유통</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#ff5d93">
<style>
*{box-sizing:border-box}body{margin:0;background:#fff3f7;color:#3a2430;font-family:'Noto Sans KR',Arial,sans-serif}
.wrap{max-width:640px;margin:auto;padding:22px 16px 70px}
.nav{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.nav a,.nav button{margin:0;color:#d9487d;font-weight:800;text-decoration:none;font-size:13px;background:none;border:0;cursor:pointer;padding:0}
h1{margin:0 0 8px;font-size:24px;color:#d9487d}
.box{background:#fff;border:2px solid #ffd6e4;border-radius:18px;padding:16px;margin-top:12px}
label{display:block;margin:10px 0 5px;font-size:12px;font-weight:800;color:#8a6b78}
input{width:100%;height:46px;border:2px solid #ffd0e2;border-radius:12px;padding:0 11px;font-size:16px}
.btn{margin-top:12px;height:46px;border:0;border-radius:12px;background:linear-gradient(180deg,#ff8fb8,#ff5d93);color:#fff;font-weight:900;cursor:pointer;padding:0 16px}
.muted{color:#8a6b78;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <div class="nav">
    <a href="/admin/home">관리홈</a>
    <a href="/admin/products">상품</a>
    <a href="/admin/orders">주문</a>
    <button type="button" id="out">로그아웃</button>
  </div>
  <h1>내 정보</h1>
  <div class="box">
    <label>로그인 아이디</label><input id="loginId" disabled>
    <label>이름</label><input id="name">
    <label>이메일</label><input id="email">
    <label>휴대폰</label><input id="phone">
    <button class="btn" id="saveP" type="button">정보 저장</button>
  </div>
  <div class="box">
    <label>현재 비밀번호</label><input id="cur" type="password">
    <label>새 비밀번호</label><input id="npw" type="password">
    <button class="btn" id="savePw" type="button">비밀번호 변경</button>
  </div>
</div>
<script>
async function gate(){
  const s=await (await fetch('/local-api/admin/status')).json();
  if(!s.loggedIn){location.replace('/admin?next=/admin/me');return false}
  const p=await (await fetch('/local-api/admin/profile')).json();
  loginId.value=p.id||s.id||'';
  name.value=p.name||''; email.value=p.email||''; phone.value=p.phone||'';
  return true;
}
saveP.onclick=async()=>{
  const r=await fetch('/local-api/admin/profile',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({name:name.value,email:email.value,phone:phone.value})});
  const d=await r.json();
  alert(d.success?'저장했습니다.':(d.error||'실패'));
};
savePw.onclick=async()=>{
  const r=await fetch('/local-api/admin/password',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({current:cur.value,password:npw.value})});
  const d=await r.json();
  alert(d.success?'비밀번호를 바꿨습니다.':(d.error||'실패'));
};
out.onclick=async()=>{await fetch('/local-api/admin/logout',{method:'POST'});location.replace('/admin')};
gate();
</script>
</body>
</html>
