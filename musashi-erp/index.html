<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>634 MUSASHI · 매장 ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0B10;--glass:rgba(255,255,255,.04);--glass-bd:rgba(255,255,255,.09);
  --cyan:#39E6FF;--magenta:#FF006E;--text:#E8EAF2;--muted:#7B819B;
  --green-accent:#37E2A0;--gold:#C9A227;--gold-l:#E8C547;
  --ink:var(--text);--paper:var(--bg);--card:var(--glass);
  --green:var(--cyan);--green-d:#06070c;--green-l:var(--cyan);
  --line:var(--glass-bd);--red:#FF6B7A;--blue:#7EB8FF;
  --shadow:0 8px 32px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(800px circle at 18% 12%,rgba(77,124,255,.14),transparent 50%),radial-gradient(700px circle at 82% 78%,rgba(165,91,255,.1),transparent 50%)}
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.45;background-image:linear-gradient(rgba(255,255,255,.016) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.016) 1px,transparent 1px);background-size:54px 54px}
.mono{font-family:'IBM Plex Mono',monospace}
.grad{background:linear-gradient(120deg,var(--cyan),var(--magenta));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
#app{display:flex;min-height:100vh;position:relative;z-index:1}

/* Sidebar */
.side{width:252px;background:rgba(10,11,16,.82);backdrop-filter:blur(16px);color:var(--text);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0;border-right:1px solid var(--glass-bd)}
.brand{padding:20px 20px 16px;border-bottom:1px solid var(--glass-bd)}
.brand .logo{display:flex;flex-direction:column;gap:10px}
.group-logo{display:flex;flex-direction:column;line-height:1}
.group-logo .num634{font-family:'Sora',sans-serif;font-size:28px;font-weight:800;letter-spacing:-1px;background:linear-gradient(160deg,var(--gold-l),var(--gold),#9A7B1A);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.group-logo .musashi-name{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.28em;color:var(--text);margin-top:3px}
.brand-erp{display:flex;flex-direction:column;gap:2px;padding-top:8px;border-top:1px solid var(--glass-bd)}
.erp-label{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.22em;color:var(--cyan);text-transform:uppercase}
.brand-sub{font-size:11px;color:var(--muted)}
.nav{padding:8px 10px;flex:1;overflow-y:auto}
.nav-sec{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;padding:14px 12px 5px;font-weight:600}
.nav a{display:flex;align-items:center;gap:11px;padding:8px 12px;border-radius:9px;color:var(--muted);cursor:pointer;font-weight:500;font-size:13px;transition:.2s;border:1px solid transparent}
.nav a:hover{background:rgba(57,230,255,.08);color:var(--cyan)}
.nav a.on{background:rgba(57,230,255,.1);color:var(--text);border-color:rgba(57,230,255,.25);font-weight:600}
.nav a .ic{width:18px;text-align:center;font-size:13px;opacity:.85}
.side .foot{padding:12px 18px;font-size:11px;color:var(--muted);border-top:1px solid var(--glass-bd);display:flex;flex-direction:column;gap:6px}
.side .foot a{color:var(--cyan);text-decoration:none;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.06em}
.side .foot a:hover{text-decoration:underline}

/* Main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:rgba(10,11,16,.75);backdrop-filter:blur(14px);border-bottom:1px solid var(--glass-bd);padding:15px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
.top h2{font-family:'Sora',sans-serif;font-size:20px;font-weight:700;letter-spacing:-.02em}
.top .crumb{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);margin-top:3px;letter-spacing:.08em;text-transform:uppercase}
.content{padding:24px 28px 60px;max-width:1320px;width:100%}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:14px;margin-bottom:22px}
.kpi{background:var(--glass);border:1px solid var(--glass-bd);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:.25s}
.kpi::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),transparent)}
.kpi:hover{border-color:rgba(57,230,255,.35);transform:translateY(-2px)}
.kpi .k-lab{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.kpi .k-val{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;color:var(--cyan);margin-top:6px}
.kpi .k-val small{font-size:13px;font-weight:500;color:var(--muted)}
.kpi .k-sub{font-size:11px;color:var(--green-accent);margin-top:4px;font-weight:500}

/* Cards */
.card{background:var(--glass);border:1px solid var(--glass-bd);border-radius:14px;box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden}
.card-h{padding:14px 20px;border-bottom:1px solid var(--glass-bd);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card-h h3{font-family:'Sora',sans-serif;font-size:15px;font-weight:700}
.card-b{padding:18px 20px}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}
@media(max-width:1000px){.grid2{grid-template-columns:1fr}}

/* Table */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;padding:10px 12px;border-bottom:1px solid var(--glass-bd);white-space:nowrap;font-weight:500}
td{padding:11px 12px;border-bottom:1px solid var(--glass-bd);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:rgba(57,230,255,.04)}
.t-wrap{overflow-x:auto}
.t-num{text-align:right;font-variant-numeric:tabular-nums;font-family:'IBM Plex Mono',monospace;font-size:12px}
.t-name{font-weight:700;color:var(--text)}
.t-sub{font-size:11px;color:var(--muted)}

/* Buttons / form */
.btn{border:none;cursor:pointer;font-family:inherit;font-weight:600;border-radius:10px;padding:9px 16px;font-size:13px;transition:.25s;display:inline-flex;align-items:center;gap:6px}
.btn-p{background:linear-gradient(135deg,var(--cyan),var(--magenta));color:#fff}
.btn-p:hover{box-shadow:0 0 28px rgba(255,0,110,.45);transform:translateY(-1px)}
.btn-g{background:linear-gradient(135deg,var(--gold-l),var(--gold));color:#0A0B10}
.btn-g:hover{filter:brightness(1.08)}
.btn-o{background:var(--glass);border:1px solid var(--glass-bd);color:var(--text)}
.btn-o:hover{border-color:var(--cyan);color:var(--cyan)}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:8px}
.btn-x{background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px;font-weight:600;padding:4px 7px;border-radius:6px}
.btn-x:hover{background:rgba(255,107,122,.12);color:var(--red)}
.field{margin-bottom:13px}
.field label{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;color:var(--muted);margin-bottom:5px;letter-spacing:.06em;text-transform:uppercase}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--glass-bd);border-radius:9px;padding:9px 11px;font-family:inherit;font-size:13.5px;background:rgba(255,255,255,.03);color:var(--text)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(57,230,255,.12)}
.field select option{background:#12131a;color:var(--text)}
.f-row{display:grid;gap:12px}
.f2{grid-template-columns:1fr 1fr}.f3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:560px){.f2,.f3{grid-template-columns:1fr}}

/* Badge */
.bdg{display:inline-block;font-size:10px;font-weight:700;padding:3px 9px;border-radius:6px;font-family:'IBM Plex Mono',monospace;letter-spacing:.04em}
.bdg-new{background:rgba(55,226,160,.12);color:var(--green-accent);border:1px solid rgba(55,226,160,.25)}
.bdg-used{background:rgba(201,162,39,.12);color:var(--gold-l);border:1px solid rgba(201,162,39,.3)}
.bdg-b2c{background:rgba(57,230,255,.1);color:var(--cyan);border:1px solid rgba(57,230,255,.22)}
.bdg-b2b{background:rgba(255,0,110,.1);color:#ff7eb3;border:1px solid rgba(255,0,110,.22)}
.bdg-ok{background:rgba(55,226,160,.12);color:var(--green-accent);border:1px solid rgba(55,226,160,.25)}
.bdg-wait{background:rgba(201,162,39,.12);color:var(--gold-l);border:1px solid rgba(201,162,39,.3)}
.bdg-prog{background:rgba(126,184,255,.12);color:var(--blue);border:1px solid rgba(126,184,255,.25)}
.bdg-low{background:rgba(255,107,122,.12);color:var(--red);border:1px solid rgba(255,107,122,.25)}
.bdg-in{background:rgba(55,226,160,.12);color:var(--green-accent);border:1px solid rgba(55,226,160,.25)}
.bdg-out{background:rgba(255,107,122,.12);color:var(--red);border:1px solid rgba(255,107,122,.25)}
.grade{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;border-radius:6px;font-weight:700;font-size:11px;color:#fff}

/* Modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:34px 16px;overflow-y:auto}
.ov.on{display:flex}
.modal{background:#0f1018;border:1px solid var(--glass-bd);border-radius:16px;width:100%;max-width:720px;box-shadow:0 24px 70px rgba(0,0,0,.55);animation:pop .2s ease}
@keyframes pop{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.modal-h{padding:17px 22px;border-bottom:1px solid var(--glass-bd);display:flex;justify-content:space-between;align-items:center}
.modal-h h3{font-family:'Sora',sans-serif;font-size:17px;font-weight:700}
.modal-b{padding:22px;max-height:68vh;overflow-y:auto}
.modal-f{padding:14px 22px;border-top:1px solid var(--glass-bd);display:flex;justify-content:flex-end;gap:10px}
.close{background:none;border:none;font-size:24px;color:var(--muted);cursor:pointer;line-height:1}
.close:hover{color:var(--cyan)}

/* misc */
.empty{text-align:center;padding:46px 20px;color:var(--muted)}
.empty .e-ic{font-size:36px;opacity:.4;margin-bottom:8px}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.search{border:1px solid var(--glass-bd);border-radius:9px;padding:8px 12px;font-family:inherit;font-size:13px;min-width:160px;background:rgba(255,255,255,.03);color:var(--text)}
.search::placeholder{color:var(--muted)}
.chip{border:1px solid var(--glass-bd);background:rgba(255,255,255,.02);border-radius:20px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;color:var(--muted);font-family:'IBM Plex Mono',monospace}
.chip.on{background:linear-gradient(135deg,rgba(57,230,255,.25),rgba(255,0,110,.2));color:var(--text);border-color:rgba(57,230,255,.4)}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.bar-lab{width:120px;font-size:12px;font-weight:600;flex-shrink:0;text-align:right;color:var(--muted)}
.bar-track{flex:1;height:22px;background:rgba(255,255,255,.04);border-radius:6px;overflow:hidden;border:1px solid var(--glass-bd)}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--magenta));border-radius:6px;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;color:#fff;font-size:10px;font-weight:700;font-family:'IBM Plex Mono',monospace;min-width:32px}
.li-row{display:grid;grid-template-columns:1fr 70px 100px 90px 30px;gap:8px;align-items:end;margin-bottom:8px}
@media(max-width:560px){.li-row{grid-template-columns:1fr 1fr}}
.tot-box{background:rgba(57,230,255,.05);border:1px solid rgba(57,230,255,.15);border-radius:11px;padding:14px 16px;margin-top:8px}
.tot-line{display:flex;justify-content:space-between;font-size:13px;padding:3px 0}
.tot-line.big{font-size:17px;font-weight:700;font-family:'IBM Plex Mono',monospace;border-top:1px dashed var(--glass-bd);margin-top:6px;padding-top:9px;color:var(--cyan)}
.hint{font-size:11.5px;color:var(--muted);margin-top:4px}
.pill-link{font-weight:700;color:var(--cyan);cursor:pointer}.pill-link:hover{text-decoration:underline}
.tag{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;padding:3px 8px;border-radius:5px;background:rgba(255,255,255,.04);border:1px solid var(--glass-bd);color:var(--muted)}

/* Invoice preview */
.inv{font-family:'Noto Sans KR',sans-serif;color:#1a2420;background:#fff;padding:8px}
.inv h2{font-family:'Sora',sans-serif;text-align:center;font-size:22px;letter-spacing:4px;margin-bottom:14px}
.inv .row{display:flex;gap:14px;margin-bottom:14px}
.inv .box{flex:1;border:1px solid #cfd4d0;border-radius:8px;padding:11px 13px;font-size:12.5px}
.inv .box b{display:block;font-size:11px;color:#7c857f;margin-bottom:5px}
.inv table{font-size:12px;border:1px solid #cfd4d0}
.inv th,.inv td{border:1px solid #e2e6e2;padding:8px 9px}
.inv .tot{text-align:right;font-size:16px;font-weight:700;margin-top:12px}
@media print{body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{position:absolute;left:0;top:0;width:100%;padding:24px;background:#fff}}
#printArea{display:none}
#toast{position:fixed;bottom:24px;right:24px;z-index:200;background:linear-gradient(135deg,var(--cyan),var(--magenta));color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 8px 32px rgba(255,0,110,.35);opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none;max-width:320px}
#toast.on{opacity:1;transform:none}
.nav-toggle{display:none;background:var(--glass);border:1px solid var(--glass-bd);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:18px;margin-right:8px;color:var(--text)}
.nav-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40}
@media(max-width:900px){
  .nav-toggle{display:inline-flex}
  .side{position:fixed;left:0;top:0;z-index:50;transform:translateX(-100%);transition:.25s;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .nav-backdrop.on{display:block}
  .content{padding:18px 16px 48px}
  .top{padding:12px 16px}
}
</style>
</head>

<script>
/* ============ DATA LAYER ============ */
const K='musashi_';
const fmt=n=>(Math.round(n||0)).toLocaleString('ko-KR');
const won=n=>'₩'+fmt(n);
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const today=()=>new Date().toISOString().slice(0,10);
const load=(k,d)=>{try{const v=localStorage.getItem(K+k);return v?JSON.parse(v):d}catch(e){return d}};
const save=(k,v)=>localStorage.setItem(K+k,JSON.stringify(v));
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const STORES=['products','partners','sales','purchases','members','fittings','repairs','quotes','returns','payments','invoices','ledger','staff'];
const DATA_VERSION='2.2';
const DB={};
STORES.forEach(s=>DB[s]=load(s,null));
DB.settings=load('settings',null);
function persist(t){save(t,DB[t])}
/* 버전만 갱신 — 실데이터 보존 (강제 초기화는 백업 화면에서만) */
if(localStorage.getItem(K+'ver')!==DATA_VERSION){
  localStorage.setItem(K+'ver',DATA_VERSION);
}

/* ---- seed ---- */
function seed(){
  if(DB.products) return;
  DB.settings={company:'주식회사 인터네셔널무사시634',ceo:'최종숙',bizNo:'507-86-01178',addr:'인천광역시 서구 파랑로 495, 2동 906호 (청라동)',tel:'032-577-9963',email:'paullew@hanmail.net',pointRate:5,vatRate:10,lowStockThreshold:2};

let _toastT;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('on');clearTimeout(_toastT);_toastT=setTimeout(()=>el.classList.remove('on'),2800)}
function toggleNav(){document.querySelector('.side').classList.toggle('open');document.getElementById('navBackdrop').classList.toggle('on')}
function closeNav(){document.querySelector('.side').classList.remove('open');document.getElementById('navBackdrop').classList.remove('on')}
function lowStockLimit(){return Math.max(0,+DB.settings.lowStockThreshold||2)}
function logStock(type,product,qty,ref){
  DB.ledger.push({id:uid('l'),date:today(),type,product,qty:+qty||0,ref:ref||''});
  persist('ledger');
}
function findProductByName(name){return DB.products.find(p=>`${p.brand} ${p.model}`===name)}
function findProductById(id){return DB.products.find(p=>p.id===id)}
function adjustStock(productName,qtyDelta,ref){
  const p=findProductByName(productName);if(!p)return;
  p.stock=Math.max(0,(+p.stock||0)+qtyDelta);
  logStock(qtyDelta>0?'입고':'출고',productName,Math.abs(qtyDelta),ref);
  persist('products');
}
function checkStockLines(lines,getId){
  for(const l of lines){
    const id=getId(l);if(!id)continue;
    const p=findProductById(id);const q=+l.qty||1;
    if(p&&(+p.stock||0)<q)return `${p.brand} ${p.model}: 재고 ${p.stock} (필요 ${q})`;
  }
  return null;
}
function reverseSaleStock(s){
  (s.items||[]).forEach(i=>adjustStock(i.name,+i.qty,'판매삭제('+(s.partner||'')+')'));
}
function reversePurchaseStock(pu){
  (pu.items||[]).forEach(i=>adjustStock(i.name,-i.qty,'매입삭제('+(pu.supplier||'')+')'));
}
function reverseReturnStock(r){
  adjustStock(r.itemName,-r.qty,'반품삭제');
}
function reconcilePartnerAR(partner){
  if(!partner)return;
  let rem=DB.payments.filter(p=>p.partner===partner).reduce((a,p)=>a+p.amount,0);
  DB.sales.filter(s=>s.partner===partner&&s.payment==='외상').sort((a,b)=>a.date.localeCompare(b.date)).forEach(s=>{
    s.status='미수';
    if(rem>=s.total){rem-=s.total;s.status='완료'}
  });
  persist('sales');
}
function partnerOutstanding(name){
  const billed=DB.sales.filter(s=>s.partner===name&&s.status==='미수').reduce((a,s)=>a+s.total,0);
  const paid=DB.payments.filter(p=>p.partner===name).reduce((a,p)=>a+p.amount,0);
  return billed-paid;
}
function partnerSelectHtml(id,selected,allowEmpty){
  const opts=(allowEmpty!==false?'<option value="">— 선택 —</option>':'')+DB.partners.map(c=>`<option value="${esc(c.name)}" ${c.name===selected?'selected':''}>${esc(c.name)} (${c.channel})</option>`).join('');
  return `<select id="${id}" class="partner-sel" onchange="const t=document.getElementById('${id}_txt');if(t)t.value=this.value?this.options[this.selectedIndex].text.split(' (')[0]:''">${opts}</select>`;
}
function memberPickName(sel){
  const o=sel.options[sel.selectedIndex];return o&&o.value?o.textContent.split(' (')[0]:'';
}
function statusBdg(s){const m={'완료':'bdg-ok','미수':'bdg-low','입고완료':'bdg-ok','진행중':'bdg-prog','접수':'bdg-wait','발행':'bdg-ok','견적':'bdg-wait','주문전환':'bdg-ok','반품':'bdg-low','교환':'bdg-prog'};return `<span class="bdg ${m[s]||'bdg-wait'}">${esc(s)}</span>`}

/* ---------- LINE-ITEM helper (shared by quote/sale) ---------- */
function lineEditor(state,channelGetter,onChange){
  const opts=sel=>'<option value="">상품 선택</option>'+DB.products.map(x=>`<option value="${x.id}" ${sel===x.id?'selected':''}>${esc(x.brand)} ${esc(x.model)} (재고${x.stock})</option>`).join('');
  return state.map((l,i)=>`<div class="li-row">
    <div class="field" style="margin:0"><select onchange="${onChange}.set(${i},'productId',this.value);${onChange}.auto(${i})">${opts(l.productId)}</select></div>
    <div class="field" style="margin:0"><input type="number" min="1" value="${l.qty}" onchange="${onChange}.set(${i},'qty',this.value)"></div>
    <div class="field" style="margin:0"><input type="number" value="${l.price}" onchange="${onChange}.set(${i},'price',this.value)"></div>
    <div class="t-num" style="font-weight:700;padding-bottom:9px">${won((+l.qty||0)*(+l.price||0))}</div>
    <button class="btn-x" type="button" onclick="${onChange}.rm(${i})" style="padding-bottom:9px">✕</button></div>`).join('');
}

function quoteModal(){

    <div class="f-row f2"><div class="field"><label>견적일</label><input id="q_date" type="date" value="${today()}"></div><div class="field"><label>채널</label><select id="q_channel" onchange="qReprice()"><option>도매</option><option>소매</option></select></div></div>

function qRender(){const b=document.getElementById('qLines');if(!b)return;b.innerHTML=lineEditor(qLines,()=>document.getElementById('q_channel').value,'QC');const t=qLines.reduce((s,l)=>s+(+l.qty||0)*(+l.price||0),0);document.getElementById('qTot').innerHTML=`<div class="tot-line big"><span>견적 합계</span><span>${won(t)}</span></div>`}
function qReprice(){const ch=document.getElementById('q_channel')?.value;qLines.forEach(l=>{const p=findProductById(l.productId);if(p)l.price=ch==='도매'?p.wholesale:p.retail});qRender()}
function quoteToSale(id){const q=DB.quotes.find(x=>x.id===id);if(!q)return;
  for(const i of q.items){const p=findProductByName(i.name);if(p&&(+p.stock||0)<i.qty){alert(`재고 부족: ${i.name} (잔여 ${p.stock})`);return}}
  if(!confirm('이 견적을 판매(주문)로 전환할까요? 재고가 차감됩니다.'))return;
  DB.sales.push({id:uid('s'),date:today(),channel:q.channel,partner:q.partner,memberId:'',staff:'',items:q.items,total:q.total,payment:'외상',status:'미수',memo:'견적 전환'});

let sLines=[],sFilter='전체',sSearch='';
const SC={set:(i,k,v)=>{sLines[i][k]=v;sTotOnly()},auto:i=>{const ch=document.getElementById('s_channel').value;const p=DB.products.find(x=>x.id===sLines[i].productId);if(p)sLines[i].price=ch==='도매'?p.wholesale:p.retail;sRender()},rm:i=>{sLines.splice(i,1);if(!sLines.length)sLines.push({productId:'',qty:1,price:0});sRender()},add:()=>{sLines.push({productId:'',qty:1,price:0});sRender()}};
function rSales(){
  ACT.innerHTML=`<button class="btn btn-p" onclick="saleModal()">＋ 판매 등록</button>`;

  else if(sFilter==='미수'||sFilter==='완료')list=list.filter(s=>s.status===sFilter);
  const q=sSearch.toLowerCase();
  if(q)list=list.filter(s=>[s.partner,s.staff,s.memo,...s.items.map(i=>i.name)].join(' ').toLowerCase().includes(q));
  VIEW.innerHTML=`<div class="card"><div class="card-h">
    <div class="toolbar">${chips.map(c=>`<span class="chip ${sFilter===c?'on':''}" onclick="sFilter='${c}';rSales()">${c}</span>`).join('')}</div>
    <input class="search" placeholder="거래처·상품·담당 검색" value="${esc(sSearch)}" oninput="sSearch=this.value;clearTimeout(window._st);window._st=setTimeout(rSales,250)">
  </div><div class="t-wrap"><table><thead><tr><th>일자</th><th>채널</th><th>거래처</th><th>담당</th><th>상품</th><th class="t-num">금액</th><th>결제</th><th>상태</th><th></th></tr></thead><tbody>
  ${list.map(s=>`<tr><td class="t-sub">${s.date}</td><td><span class="bdg ${s.channel==='소매'?'bdg-b2c':'bdg-b2b'}">${s.channel}</span></td><td class="t-name">${esc(s.partner)}</td><td class="t-sub">${esc(s.staff)||'-'}</td><td class="t-sub">${s.items.map(i=>esc(i.name)+'×'+i.qty).join(', ')}</td><td class="t-num">${won(s.total)}</td><td class="t-sub">${esc(s.payment)}</td><td>${s.status==='미수'?`<span class="pill-link" onclick="toggleDue('${s.id}')">${statusBdg(s.status)}</span>`:statusBdg(s.status)}</td><td style="white-space:nowrap"><button class="btn-x" style="color:var(--green)" onclick="saleView('${s.id}')">명세</button><button class="btn-x" onclick="delRow('sales','${s.id}')">삭제</button></td></tr>`).join('')||emptyRow(9)}

  const s=DB.sales.find(x=>x.id===id);if(!s)return;const co=DB.settings;
  const rows=s.items.map(i=>`<tr><td>${esc(i.name)}</td><td class="t-num">${i.qty}</td><td class="t-num">${won(i.price)}</td><td class="t-num">${won(i.qty*i.price)}</td></tr>`).join('');

function toggleDue(id){const s=DB.sales.find(x=>x.id===id);if(!s)return;s.status=s.status==='미수'?'완료':'미수';persist('sales');rSales()}
function saleModal(){
  sLines=[{productId:'',qty:1,price:0}];
  const mOpt='<option value="">비회원</option>'+DB.members.map(m=>`<option value="${m.id}">${esc(m.name)} (${m.grade})</option>`).join('');
  const stOpt='<option value="">담당 미지정</option>'+DB.staff.filter(s=>s.status==='재직').map(s=>`<option>${esc(s.name)}</option>`).join('');
  openModal('판매 등록',`
    <div class="f-row f3"><div class="field"><label>판매일</label><input id="s_date" type="date" value="${today()}"></div><div class="field"><label>채널</label><select id="s_channel" onchange="sReprice();sSyncPartner()"><option>소매</option><option>도매</option></select></div><div class="field"><label>결제수단</label><select id="s_pay"><option>카드</option><option>현금</option><option>계좌이체</option><option>외상</option></select></div></div>
    <div class="f-row f3"><div class="field"><label>거래처/고객</label>${partnerSelectHtml('s_partner','',true)}<input id="s_partner_txt" placeholder="또는 직접 입력" style="margin-top:6px" oninput="document.getElementById('s_partner').value=''"></div><div class="field"><label>회원 연결</label><select id="s_member" onchange="sMemberPick()">${mOpt}</select></div><div class="field"><label>담당 직원</label><select id="s_staff">${stOpt}</select></div></div>
    <div class="field"><label>판매 상품</label><div id="sLines"></div><button class="btn btn-o btn-sm" type="button" onclick="SC.add()">＋ 상품 추가</button></div>
    <div class="tot-box" id="sTot"></div>
    <div class="field" style="margin-top:13px"><label>메모</label><input id="s_memo"></div>`,()=>{
    const stockErr=checkStockLines(sLines,l=>l.productId);
    if(stockErr){alert('재고 부족: '+stockErr);return false}
    const items=sLines.filter(l=>l.productId).map(l=>{const p=DB.products.find(x=>x.id===l.productId);return{productId:l.productId,name:p?`${p.brand} ${p.model}`:'상품',qty:+l.qty||1,price:+l.price||0}});
    if(!items.length){alert('상품을 추가하세요');return false}
    const total=items.reduce((s,i)=>s+i.qty*i.price,0);
    const pay=document.getElementById('s_pay').value,memberId=document.getElementById('s_member').value,channel=document.getElementById('s_channel').value;
    const partner=document.getElementById('s_partner').value||document.getElementById('s_partner_txt').value.trim();
    if(!partner){alert('거래처/고객명을 입력하세요');return false}
    DB.sales.push({id:uid('s'),date:document.getElementById('s_date').value,channel,partner,memberId,staff:document.getElementById('s_staff').value,items:items.map(({name,qty,price})=>({name,qty,price})),total,payment:pay,status:pay==='외상'?'미수':'완료',memo:document.getElementById('s_memo').value});
    items.forEach(i=>adjustStock(i.name,-i.qty,'판매('+(partner||'고객')+')'));
    if(memberId&&channel==='소매'){const m=DB.members.find(x=>x.id===memberId);if(m)m.points=(+m.points||0)+Math.round(total*(DB.settings.pointRate||0)/100)}
    persist('sales');persist('members');rSales();toast('판매가 등록되었습니다');return true;
  });
  sRender();
}
function sRender(){const b=document.getElementById('sLines');if(!b)return;b.innerHTML=lineEditor(sLines,()=>document.getElementById('s_channel').value,'SC');sTot();if(document.getElementById('s_channel'))sSyncPartner()}
function sReprice(){const ch=document.getElementById('s_channel').value;sLines.forEach(l=>{const p=DB.products.find(x=>x.id===l.productId);if(p)l.price=ch==='도매'?p.wholesale:p.retail});sRender()}
function sTotOnly(){const t=document.querySelectorAll('#sLines .t-num');sLines.forEach((l,i)=>{if(t[i])t[i].textContent=won((+l.qty||0)*(+l.price||0))});sTot()}
function sTot(){const box=document.getElementById('sTot');if(!box)return;const total=sLines.reduce((s,l)=>s+(+l.qty||0)*(+l.price||0),0);const ch=document.getElementById('s_channel')?.value,mid=document.getElementById('s_member')?.value;const rate=DB.settings.pointRate||0;const pts=(mid&&ch==='소매')?Math.round(total*rate/100):0;box.innerHTML=`<div class="tot-line"><span>상품 합계</span><span>${won(total)}</span></div>${pts?`<div class="tot-line" style="color:var(--gold)"><span>적립 예정 (${rate}%)</span><span>+${fmt(pts)}P</span></div>`:''}<div class="tot-line big"><span>총 결제금액</span><span>${won(total)}</span></div>`}
function sMemberPick(){const sel=document.getElementById('s_member');const n=memberPickName(sel);if(n){document.getElementById('s_partner_txt').value=n;document.getElementById('s_partner').value=''}sTot()}
function sSyncPartner(){const ch=document.getElementById('s_channel').value;const sel=document.getElementById('s_partner');[...sel.options].forEach(o=>{if(!o.value)return;const p=DB.partners.find(c=>c.name===o.value);if(p)o.hidden=p.channel!==ch});sReprice()}

function rReturns(){
  ACT.innerHTML=`<button class="btn btn-p" onclick="returnModal()">＋ 반품·교환 접수</button>`;
  VIEW.innerHTML=`<div class="card"><div class="t-wrap"><table><thead><tr><th>일자</th><th>구분</th><th>거래처/고객</th><th>품목</th><th class="t-num">금액</th><th>사유</th><th></th></tr></thead><tbody>
  ${DB.returns.slice().reverse().map(r=>`<tr><td class="t-sub">${r.date}</td><td>${statusBdg(r.kind)}</td><td class="t-name">${esc(r.partner)}</td><td class="t-sub">${esc(r.itemName)} ×${r.qty}</td><td class="t-num">${won(r.amount)}</td><td class="t-sub">${esc(r.reason)}</td><td><button class="btn-x" onclick="delRow('returns','${r.id}')">삭제</button></td></tr>`).join('')||emptyRow(7)}
  </tbody></table></div></div>`;
}
function returnModal(){
  const saleOpts='<option value="">— 원거래 선택 —</option>'+DB.sales.slice().reverse().map(s=>`<option value="${s.id}">${s.date} · ${esc(s.partner)} · ${won(s.total)}</option>`).join('');
  openModal('반품·교환 접수',`
    <div class="field"><label>원거래</label><select id="rt_sale" onchange="rtFill()">${saleOpts}</select></div>
    <div class="f-row f2"><div class="field"><label>구분</label><select id="rt_kind"><option>반품</option><option>교환</option></select></div><div class="field"><label>처리일</label><input id="rt_date" type="date" value="${today()}"></div></div>
    <div class="field"><label>품목</label><select id="rt_item"></select></div>
    <div class="f-row f2"><div class="field"><label>수량</label><input id="rt_qty" type="number" value="1" min="1"></div><div class="field"><label>환불/조정 금액</label><input id="rt_amount" type="number" value="0"></div></div>
    <div class="field"><label>사유</label><input id="rt_reason" placeholder="단순변심 / 불량 / 사이즈 등"></div>
    <div class="hint">저장 시 해당 품목이 재고로 재입고되고 수불부에 기록됩니다.</div>`,()=>{
    const itemName=document.getElementById('rt_item').value;
    if(!itemName){alert('품목을 선택하세요');return false}
    const qty=+document.getElementById('rt_qty').value||1;
    const sale=DB.sales.find(s=>s.id===document.getElementById('rt_sale').value);
    DB.returns.push({id:uid('rt'),date:document.getElementById('rt_date').value,kind:document.getElementById('rt_kind').value,partner:sale?sale.partner:'',itemName,qty,amount:+document.getElementById('rt_amount').value||0,reason:document.getElementById('rt_reason').value});
    adjustStock(itemName,qty,'반품/교환');
    persist('returns');rReturns();toast('반품·교환이 접수되었습니다');return true;
  });
  rtFill();
}
function rtFill(){

/* ---------- STATS ---------- */
function rStats(){
  const byCh={'소매':0,'도매':0},byMonth={},byCat={},byStaff={};
  DB.sales.forEach(s=>{byCh[s.channel]=(byCh[s.channel]||0)+s.total;const mo=(s.date||'').slice(0,7);byMonth[mo]=(byMonth[mo]||0)+s.total;if(s.staff)byStaff[s.staff]=(byStaff[s.staff]||0)+s.total});
  DB.products.forEach(p=>{byCat[p.category]=(byCat[p.category]||0)+(+p.stock||0)*(+p.retail||0)});
  const bar=(o,money=true)=>{const e=Object.entries(o).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);if(!e.length)return '<div class="empty" style="padding:20px">데이터 없음</div>';const max=Math.max(...e.map(x=>x[1]));return e.map(([k,v])=>`<div class="bar-row"><div class="bar-lab">${esc(k)}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.max(8,v/max*100)}%">${money?won(v):fmt(v)}</div></div></div>`).join('')};
  const total=DB.sales.reduce((s,x)=>s+x.total,0);
  const cogs=DB.sales.reduce((s,x)=>s+x.items.reduce((a,i)=>{const p=findProductByName(i.name);return a+(p?p.cost*i.qty:0)},0),0);
  const margin=total-cogs;
  VIEW.innerHTML=`
  <div class="kpis"><div class="kpi"><div class="k-lab">총 매출</div><div class="k-val" style="font-size:19px">${won(total)}</div></div><div class="kpi"><div class="k-lab">추정 원가</div><div class="k-val" style="font-size:19px">${won(cogs)}</div></div><div class="kpi"><div class="k-lab">추정 매출이익</div><div class="k-val" style="font-size:19px;color:var(--green-l)">${won(margin)}</div><div class="k-sub">이익률 ${total?Math.round(margin/total*100):0}%</div></div></div>
  <div class="grid2"><div class="card"><div class="card-h"><h3>채널별 매출</h3></div><div class="card-b">${bar(byCh)}</div></div><div class="card"><div class="card-h"><h3>월별 매출</h3></div><div class="card-b">${bar(byMonth)}</div></div></div>
  <div class="grid2"><div class="card"><div class="card-h"><h3>담당자별 매출</h3></div><div class="card-b">${bar(byStaff)}</div></div><div class="card"><div class="card-h"><h3>카테고리별 재고자산(소매가)</h3></div><div class="card-b">${bar(byCat)}</div></div></div>`;
}

function rBackup(){
  const counts=STORES.map(s=>`${s}: ${(DB[s]||[]).length}`).join(' · ');
  VIEW.innerHTML=`<div class="card" style="max-width:680px"><div class="card-h"><h3>데이터 백업 / 복원</h3></div><div class="card-b">
    <p class="hint" style="margin-bottom:14px">모든 데이터는 이 브라우저에 저장됩니다. 정기적으로 백업 파일을 내려받아 보관하세요.</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn btn-p" onclick="exportData()">⤓ 전체 백업(JSON) 내보내기</button>
      <button class="btn btn-o" onclick="document.getElementById('imp').click()">⤒ 백업 복원</button>
      <button class="btn btn-o" style="color:var(--red);border-color:var(--red)" onclick="resetData()">초기화(데모 재설정)</button>
    </div>
    <input type="file" id="imp" accept="application/json" style="display:none" onchange="importData(this)">
    <div style="margin-top:16px;font-size:12px;color:var(--muted)">현재 저장 현황 — ${counts}</div>
  </div></div>`;
}
function exportData(){
  const out={};STORES.forEach(s=>out[s]=DB[s]);out.settings=DB.settings;out._dataVersion=DATA_VERSION;out._exportedAt=new Date().toISOString();
  const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='musashi-erp-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href);
}
function importData(input){
  const file=input.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.settings&&!d.products){alert('MUSASHI ERP 백업 파일이 아닙니다');return}
    const n=STORES.reduce((a,s)=>a+((d[s]||[]).length),0);
    if(!confirm(`현재 데이터를 백업본으로 덮어쓸까요?\n(레코드 약 ${n}건)`))return;
    STORES.forEach(s=>{if(d[s]){DB[s]=d[s];persist(s)}});if(d.settings){DB.settings=d.settings;if(DB.settings.lowStockThreshold==null)DB.settings.lowStockThreshold=2;persist('settings')}
    toast('복원되었습니다');go('dash')}catch(e){alert('파일을 읽을 수 없습니다: '+e.message)}};
  r.readAsText(file);
}
function resetData(){if(!confirm('모든 데이터를 삭제하고 데모 상태로 되돌립니다. 계속할까요?'))return;STORES.forEach(s=>localStorage.removeItem(K+s));localStorage.removeItem(K+'settings');location.reload()}

/* ---------- SHARED ---------- */
function delRow(type,id){
  const row=DB[type]?.find(x=>x.id===id);
  const labels={sales:'판매',purchases:'매입',returns:'반품',payments:'수금',quotes:'견적'};
  if(!confirm((labels[type]||'항목')+'을(를) 삭제할까요?'+(type==='sales'||type==='purchases'||type==='returns'?' 재고가 자동 복원됩니다.':'')))return;
  if(type==='sales'&&row){
    reverseSaleStock(row);
    if(row.memberId&&row.channel==='소매'){const m=DB.members.find(x=>x.id===row.memberId);if(m)m.points=Math.max(0,(+m.points||0)-Math.round(row.total*(DB.settings.pointRate||0)/100));persist('members')}
  }
  if(type==='purchases'&&row)reversePurchaseStock(row);
  if(type==='returns'&&row)reverseReturnStock(row);
  if(type==='payments'&&row){
    DB[type]=DB[type].filter(x=>x.id!==id);persist(type);reconcilePartnerAR(row.partner);rAR();toast('삭제되었습니다');return;
  }
  DB[type]=DB[type].filter(x=>x.id!==id);persist(type);
  ROUTER[{products:'products',partners:'partners',sales:'sales',purchases:'purchases',members:'members',fittings:'fittings',repairs:'repairs',quotes:'quotes',returns:'returns',invoices:'invoices',staff:'staff',payments:'ar',ledger:'ledger'}[type]||'dash']();
  toast('삭제되었습니다');
}
let _onSave=null;
function openModal(title,body,onSave,showSave=true,saveLabel='저장'){
  _onSave=onSave;
  document.getElementById('modal').innerHTML=`<div class="modal-h"><h3>${esc(title)}</h3><button class="close" onclick="closeModal()">×</button></div><div class="modal-b">${body}</div><div class="modal-f"><button class="btn btn-o" onclick="closeModal()">닫기</button>${(onSave&&showSave!==false)?`<button class="btn btn-p" onclick="doSave()">${saveLabel}</button>`:''}</div>`;
  document.getElementById('ov').classList.add('on');
}
function closeModal(){document.getElementById('ov').classList.remove('on');_onSave=null}
function doSave(){if(_onSave&&_onSave()!==false)closeModal()}
document.getElementById('ov').addEventListener('click',e=>{if(e.target.id==='ov')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeNav();if(e.key==='Escape'&&document.getElementById('ov').classList.contains('on'))closeModal()});

go('dash');
</script>
