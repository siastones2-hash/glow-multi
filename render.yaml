services:
  - type: web
    name: supershasha
    runtime: node
    plan: free
    rootDir: supershasha
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/config
    autoDeploy: true
    envVars:
      - key: MORETHAN_API_URL
        value: https://morethanpanel.com/api/v2
      - key: MORETHAN_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: leestones
      - key: ADMIN_PASSWORD
        sync: false
      - key: PLATFORM_SLUG
        value: sh4-op-internal
      - key: MASTER_SLUG
        value: master
      - key: FX_KRW
        value: "1527"
      - key: KOREA_ONLY
        value: "false"
