<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <meta property="og:image" content="https://siastones2-hash.github.io/glow-multi/3d-around/yongma/og.jpg" />
  <meta property="og:image:secure_url" content="https://siastones2-hash.github.io/glow-multi/3d-around/yongma/og.jpg" />

  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="용마미식거리" />
  <meta name="twitter:description" content="강원 강릉시 경강로 포남1동주민센터 일대. 용마미식거리." />
  <meta name="twitter:image" content="https://siastones2-hash.github.io/glow-multi/3d-around/yongma/og.jpg" />
  <meta name="theme-color" content="#161310" />
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: #1c1a17;
      background: #f4f0ea;
      font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    .wrap { width: min(1080px, calc(100% - 40px)); margin: 0 auto; }

    .hero {
      position: relative;
      height: 72vh;
      min-height: 520px;
      background: #d9d3cb url("poster.jpg") center / cover no-repeat;
    }
    .hero iframe {
      position: absolute;
      z-index: 1;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: transparent;
    }
    .plate, .jump {
      position: absolute;
      z-index: 3;
      display: inline-flex;
      align-items: center;
      background: #161310;
      color: #fff;
      font-weight: 750;
      letter-spacing: -.03em;
    }
    .plate {
      top: 0;
      left: 0;
      height: 60px;
      min-width: 260px;
      padding: 0 22px;
      border-radius: 0 0 16px 0;
      font-size: 18px;
    }
    .jump {
      top: 12px;
      right: 14px;
      height: 36px;
      padding: 0 14px;
      border-radius: 999px;
      font-size: 14px;
    }

    .intro { padding: 54px 0 8px; }
    .kicker {
      margin: 0;
      color: #9a6230;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .22em;
    }
    .intro h1 {
      margin: 10px 0 0;
      font-size: 40px;
      font-weight: 720;
      letter-spacing: -.045em;
    }
    .intro p {
      max-width: 560px;
      margin: 12px 0 0;
      color: #5c564e;
      font-size: 17px;
      line-height: 1.6;
    }
    section { padding: 28px 0; scroll-margin-top: 20px; }
    section h2 {
      margin: 0 0 14px;
      font-size: 22px;
      letter-spacing: -.03em;
    }
    .place p, .how-body li { margin: 0; font-size: 16px; line-height: 1.7; }
    .how { padding-top: 0; }
    .fold {
      width: 100%;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 14px;
      background: #161310;
      color: #fff;
      font-size: 16px;
      font-weight: 750;
    }
    .fold::after { content: "↓"; font-size: 14px; }
    .fold[aria-expanded="true"]::after { content: "↑"; }
    .how-body { padding: 0 0 8px; }
    .how-body[hidden] { display: none; }
    .how-body ol { margin: 0 0 16px; padding-left: 20px; }
    .how-body li + li { margin-top: 8px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .actions a, .actions button {
      height: 40px;
      display: inline-flex;
      align-items: center;
      padding: 0 14px;
      border-radius: 999px;
      background: #161310;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
    }
    .actions a.line, .actions button.line {
      background: transparent;
      color: #1c1a17;
      border: 1px solid rgba(28,26,23,.22);
    }
    .map {
      margin-top: 16px;
      height: 240px;
      border-radius: 16px;
      overflow: hidden;
      background: #e7e1d8;
    }
    .map iframe { width: 100%; height: 100%; border: 0; }
    footer {
      margin-top: 12px;
      padding: 28px 0 40px;
      color: #6d675f;
      font-size: 14px;
    }

    @media (max-width: 800px) {
      .wrap { width: min(100% - 32px, 1080px); }
      .hero { height: 70vh; min-height: 460px; }
      .plate { height: 56px; min-width: 230px; font-size: 17px; }
      .intro { padding-top: 32px; }
      .intro h1 { font-size: 32px; }
    }
  </style>
</head>
<body>
  <div class="hero" id="top">
    <iframe
      id="tour"
      title="용마미식거리 3D 둘러보기"
      allow="fullscreen; xr-spatial-tracking"
      allowfullscreen
      referrerpolicy="no-referrer-when-downgrade"
      sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-forms allow-presentation"
    ></iframe>
    <a class="plate" href="#top">용마미식거리</a>
    <a class="jump" href="#place">오시는 길</a>
  </div>

  <main class="wrap">
    <div class="intro">
      <p class="kicker">3D어라운드</p>
      <h1>용마미식거리</h1>
      <p>강원 강릉시 경강로 포남1동주민센터 일대.<br />촬영한 거리를 열어 두었습니다.</p>
    </div>

    <section class="place" id="place">
      <h2>오시는 길</h2>
      <p>강원 강릉시 경강로 포남1동주민센터 일대</p>
      <div class="map">
        <iframe id="map-frame" title="용마미식거리 위치" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>
      <div class="actions">
        <a href="https://map.naver.com/p/search/%EA%B0%95%EC%9B%90%20%EA%B0%95%EB%A6%89%EC%8B%9C%20%EA%B2%BD%EA%B0%95%EB%A1%9C%20%ED%8F%AC%EB%82%A81%EB%8F%99%EC%A3%BC%EB%AF%BC%EC%84%BC%ED%84%B0" target="_blank" rel="noopener noreferrer">네이버 지도</a>
        <button class="line" id="copy" type="button">이 거리 보내기</button>
      </div>
    </section>

    <section class="how" id="how">
      <button class="fold" id="how-btn" type="button" aria-expanded="false" aria-controls="how-body">
        <span id="how-label">걷는 법 보기</span>
      </button>
      <div class="how-body" id="how-body" hidden>
        <ol>
          <li>바닥을 누르면 그 자리로 이동합니다.</li>
          <li>화면을 끌면 주변을 둘러봅니다.</li>
          <li>처음 위치를 누르면 3D 평면도부터 다시 들어갑니다.</li>
          <li>왼쪽 아래 버튼으로 평면도와 거리 전체를 볼 수 있습니다.</li>
        </ol>
        <div class="actions">
          <button class="line" id="reset" type="button">처음 위치</button>
        </div>
      </div>
    </section>

    <footer>용마미식거리 · 강원 강릉시 경강로 포남1동주민센터 일대</footer>
  </main>

  <script>
    const pageUrl = "https://siastones2-hash.github.io/glow-multi/3d-around/용마미식거리/";
    const intro = "https://my.matterport.com/show/?m=o81fY7Gp7rJ&play=1&lang=ko&title=0&help=0&hr=0&mls=0&brand=0";
    const frame = document.getElementById("tour");
    frame.src = intro;

    document.getElementById("reset").addEventListener("click", () => {
      frame.src = intro + "&t=" + Date.now();
      document.getElementById("top").scrollIntoView();
    });

    document.getElementById("copy").addEventListener("click", async (event) => {
      const button = event.currentTarget;
      try {
        await navigator.clipboard.writeText(pageUrl);
      } catch (error) {
        const field = document.createElement("input");
        field.value = pageUrl;
        document.body.appendChild(field);
        field.select();
        document.execCommand("copy");
        field.remove();
      }
      button.textContent = "주소를 복사했습니다";
      setTimeout(() => { button.textContent = "이 거리 보내기"; }, 1600);
    });

    const howBtn = document.getElementById("how-btn");
    const howBody = document.getElementById("how-body");
    const howLabel = document.getElementById("how-label");
    howBtn.addEventListener("click", () => {
      const open = howBtn.getAttribute("aria-expanded") === "true";
      howBtn.setAttribute("aria-expanded", open ? "false" : "true");
      howBody.hidden = open;
      howLabel.textContent = open ? "걷는 법 보기" : "걷는 법 닫기";
    });

    const map = document.getElementById("map-frame");
    const place = document.getElementById("place");
    const mapSrc = "https://maps.google.com/maps?q=%EA%B0%95%EC%9B%90%20%EA%B0%95%EB%A6%89%EC%8B%9C%20%EA%B2%BD%EA%B0%95%EB%A1%9C%20%ED%8F%AC%EB%82%A81%EB%8F%99%EC%A3%BC%EB%AF%BC%EC%84%BC%ED%84%B0&z=16&output=embed";
    if ("IntersectionObserver" in window) {
      const watcher = new IntersectionObserver((entries) => {
        if (entries.some((entry) => entry.isIntersecting)) {
          map.src = mapSrc;
          watcher.disconnect();
        }
      });
      watcher.observe(place);
    } else {
      map.src = mapSrc;
    }
  </script>
</body>
</html>
